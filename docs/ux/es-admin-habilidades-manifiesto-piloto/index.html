  const hist=()=>'<h2 class="pl-sec" id="hh">'+Q.mfHistory+'</h2>'+(scene==='mf-loading'?'<p class="cg-hint" role="status">'+Q.mfLoading+'</p>':scene==='mf-empty'?'<p>'+Q.mfEmpty+'</p>':'<div class="cg-card" style="padding:.2rem 1.1rem">'+mfv.map((v,i)=>'<div class="mf-ver"><button type="button" class="mf-ver__head" aria-expanded="'+(i===1&&scene==='mf'?'true':'false')+'"><span>'+(v[2]?chip('● '+Q.mfBadge,'cg-chip--ok')+' ':'')+'<strong>'+v[1]+'</strong></span><span class="mf-ver__tail"><span class="cg-hint">Marta '+ex()+'</span><span aria-hidden="true">'+(i===1&&scene==='mf'?'▴':'▾')+'</span></span></button>'+(v[2]?'':'<div class="pg-actions" style="margin:0 0 .6rem">'+btn(Q.mfRollback,'cg-btn--ghost')+'</div>')+(i===1&&scene==='mf'?'<p class="mf-body" style="margin:.2rem 0 .8rem">'+(lang==='es'?'Texto de ejemplo de una versión anterior.':'Example text of an earlier version.')+'</p>':'')+'</div>').join('')+'</div>');
  const form=(er,pub)=>card(Q.mfFormTitle,field('nt',Q.mfNote,'',{hint:''}).replace('value=""','value="" placeholder="'+Q.mfNotePh+'"')+'<div class="cg-field'+(er?' is-missing':'')+'"><label class="cg-label" for="ct">'+Q.mfContent+' <span aria-hidden="true">*</span></label><textarea class="cg-textarea" id="ct" '+(er?'aria-invalid="true" ':'')+'aria-describedby="cth" placeholder="'+Q.mfPh+'" rows="10">'+(er?'Texto corto':'')+'</textarea>'+(er?'<p class="cg-error" id="cth" role="alert">'+Q.mfErrMin+'</p>':'<p class="cg-hint" id="cth"><span class="cg-count">0</span> '+Q.mfChars+'</p>')+'</div><div class="pg-actions">'+btn(pub?Q.mfPublishing:Q.mfPublish,'',pub?'disabled aria-busy="true"':'')+'</div>','mfc');
  h=head(Q.mfTitle,Q.mfSub)+(scene==='mf-error'?banner(Q.mfErrLoad,1,btn(Q.retry,'cg-btn--ghost')):'')+(scene==='mf-ok'?status(Q.mfOkUp+' v3',0):'')
   +(scene==='mf-loading'||scene==='mf-empty'||scene==='mf-error'?'':act)
   +'<div class="pg-actions" style="margin:1rem 0">'+btn(scene==='mf-form'||scene==='mf-form-err'||scene==='mf-publishing'?Q.cancel:Q.mfNew,'cg-btn--ghost','aria-expanded="'+(scene==='mf-form'||scene==='mf-form-err'||scene==='mf-publishing')+'"')+'<a href="#pub">'+Q.mfPublic+'</a></div>'
   +(scene==='mf-form'?form(0,0):scene==='mf-form-err'?form(1,0):scene==='mf-publishing'?form(0,1):'')
   +(scene==='mf-error'?'':hist())
   +(scene==='mf-confirm'?dlg(Q.mfConfirm+' v2?','',btn(Q.cancel,'cg-btn--ghost')+btn(Q.mfRollback)):'');
  h='<div class="pg-wide">'+h+'</div>'
 }
 if(scene.startsWith('pl')){
  const pv=scene!=='pl';
  const strip=pv?banner(Q.plPreview+'<br><span style="font-weight:400">'+Q.plLocal+'</span>',0):'';
  const tg='<h2 class="pl-sec">'+Q.plTargets+'</h2><p>'+Q.plWarn+'</p><div class="pl-grid">'+Q.plM.map(m=>'<article class="cg-card pl-pend"><h3>'+m+'</h3><p>'+Q.plTargetPend+'</p><p class="cg-hint">'+Q.plProposed+'</p></article>').join('')+'</div>';
  const st=[0,3,4,2];
  const live=()=>'<div class="pl-grid">'+Q.plM.map((m,i)=>{const x=st[i];return '<article class="cg-card"><h3>'+m+'</h3><p>'+chip(Q.plStates[x],x===4?'cg-chip--ok':x===3?'cg-chip--wait':'')+'</p>'+(x===3?'<p class="cg-hint">'+Q.plProt+'</p>':'')+(x===4?'<dl class="pl-dl">'+Q.plCnt.map((c,j)=>'<div><dt>'+c+'</dt><dd>'+[12,9,3,7][j]+'</dd></div>').join('')+'</dl>':'')+'</article>'}).join('')+'</div>';
  h='<div class="pg-wide">'+head(Q.plTitle,pv?Q.plCohort:'')+strip+tg+'<h2 class="pl-sec">'+(pv?Q.plObsF:Q.plObs)+'</h2>'
   +(pv?'<p role="status" aria-live="polite" class="cg-hint">'+(scene==='pl-loading'?Q.plLoad:scene==='pl-error'?'':'')+'</p>'+(scene==='pl-error'?banner(Q.plLoadErr,1,btn(Q.retry,'cg-btn--ghost')):'')+(scene==='pl-preview'?live():'')+'<div class="pg-actions">'+btn(Q.plSim,'cg-btn--ghost',scene==='pl-loading'?'disabled aria-busy="true"':'')+'</div>'
     :'<p>'+Q.plPend+'</p><div class="pl-grid">'+Q.plM.map(m=>'<article class="cg-card"><h3>'+m+'</h3><p>'+Q.plNo+'</p></article>').join('')+'</div><div class="pg-actions">'+btn(Q.plRefresh,'cg-btn--ghost','disabled aria-describedby="rn"')+'</div><p class="cg-hint" id="rn">'+Q.plRefreshNote+'</p>')+'</div>'
 }
 return frame(h)}
function render(){q('root').innerHTML=sc();document.documentElement.lang=lang;const dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.style.background=dark?'#0e1613':'#e7ece8'}
document.addEventListener('click',e=>{const x=e.target.closest('[data-lang],[data-theme-set]');if(!x)return;if(x.dataset.lang){lang=x.dataset.lang;q('lang').value=lang}else{theme=x.dataset.themeSet;q('theme').value=theme}render()});
q('scene').onchange=e=>{scene=e.target.value;render()};q('lang').onchange=e=>{lang=e.target.value;render()};q('theme').onchange=e=>{theme=e.target.value;render()};
const hh=new URLSearchParams(location.hash.slice(1));if(hh.get('scene')){scene=hh.get('scene');q('scene').value=scene}if(hh.get('lang')){lang=hh.get('lang');q('lang').value=lang}if(hh.get('theme')){theme=hh.get('theme');q('theme').value=theme}
render();
</script>
