 month:'/ month',year:'/ year',notice:'Elevation’s AI assistant offers non-clinical support and career guidance; it does not replace psychological, medical or emergency care.',
 plans:[['Basic','Free'],['Essential','12 USD'],['Plus','29 USD'],['Pro','59 USD']],
 title:'Application for professionals',home:'Back to home',intro:'Tell us who you are and attach your résumé. The Elevation team reviews your application and writes to the email you provide. Afterwards, a board verifies your credentials before giving you access.',
 req:'required',opt:'optional',name:'Full name',email:'Email address',country:'Country',profession:'Profession or specialty',license:'License or professional registration number',licenseHelp:'If it applies in your country.',profile:'Professional profile (link)',profileHelp:'For example, your public profile. It must start with https://',message:'Message',messageHelp:'Up to 1,000 characters.',
 cv:'Résumé / CV (PDF, up to 5 MB)',cvHelp:'Only PDF files up to 5 MB are accepted. Only the Elevation team can see it.',cvChosen:'Selected file',cvRemove:'Remove file',consent:'I accept the privacy notice: Elevation will use my data only to evaluate this application.',submit:'Send application',sending:'Sending…',proNotice:'Elevation is not an emergency service and does not replace clinical care.',

 okTitle:'Application received',okBody:'We received your application. The Elevation team will review it and write to the email you provided.'}};
const q=id=>document.getElementById(id);let lang='es',theme='system',scene='pricing';const c=()=>S[lang];
const ph=()=>lang==='es'?'Texto de ejemplo':'Example text';
const langSw=()=>`<div class="cg-lang" role="group" aria-label="${c().lang}">${['es','en'].map(l=>`<button type="button" class="cg-lang__btn" lang="${l}" aria-pressed="${lang===l}" data-lang="${l}">${l.toUpperCase()}</button>`).join('')}</div>`;
const themeSw=()=>`<div class="cg-seg" role="group" aria-label="${c().theme}">${[['system','tsys'],['light','tlight'],['dark','tdark']].map(([v,k])=>`<button type="button" aria-pressed="${theme===v}" data-theme-set="${v}">${c()[k]}</button>`).join('')}</div>`;
const btn=(t,cl='',x='')=>`<button type="button" class="cg-btn ${cl}" ${x}>${t}</button>`;
const note=(t,err,role)=>`<div class="cg-banner${err?' cg-banner--error':''}" role="${role||(err?'alert':'status')}"><span class="cg-banner__title">${t}</span></div>`;
function pubFrame(inner){const k=c();return `<div class="cg cg-frame" ${theme==='system'?'':`data-theme="${theme}"`}><a class="cg-skip" href="#main">${k.skip}</a>
 <header class="cg-header"><a class="cg-brand" href="#h" aria-label="Elevation">Elevation<i>.</i></a>
 <nav class="cg-nav cg-nav--grid" aria-label="${k.how}"><a href="#how">${k.how}</a><a href="#priv">${k.privacy}</a><a href="#man">${k.manifest}</a><a href="#in">${k.signIn}</a><a class="cg-btn" href="#up">${k.signUp}</a></nav>
 <div class="cg-header__end">${langSw()}</div></header>
 <div class="cg-body"><main id="main" tabindex="-1" class="cg-main">${inner}</main></div><div class="cg-prefs" role="group" aria-label="${k.prefs}"><span class="cg-prefs__group"><span>${k.theme}</span>${themeSw()}</span></div><footer class="cg-footer"><span>${k.foot1}</span><span>${k.foot2}</span></footer></div>`}
const head=(title,lead,tag)=>`<header class="pg-head">${tag?`<p class="cg-tag">${tag}</p>`:''}<h1 class="pg-title">${title}</h1>${lead?`<p class="pg-lead">${lead}</p>`:''}</header>`;
// ---- precios
function plans(k,{auth,sel,pend,dis}){return `<div class="pp-grid">${k.plans.map(([n,p],i)=>{const hl=i===2,on=sel===i,isPend=pend===i;const free=i===0;return `<article class="cg-card pp-plan${hl?' pp-plan--hl':''}${on?' pp-plan--sel':''}" aria-labelledby="pn${i}">${hl?`<span class="cg-chip">${k.featured}</span>`:''}<h2 id="pn${i}">${n} ${k.ex}</h2><p>${ph()} ${k.ex}</p><p class="pp-price">${p}</p><p class="cg-hint">${free?'USD · ':''}${k.month}</p><ul class="pp-feats"><li>${ph()} ${k.ex}</li><li>${ph()} ${k.ex}</li></ul>${auth?btn(isPend?k.pending:k.request,'',`${dis?'disabled aria-describedby="st"':''}`):`<a class="cg-btn" href="#r${i}" ${dis?'aria-disabled="true" tabindex="-1" aria-describedby="st"':''}>${k.register}</a>`}</article>`}).join('')}</div>`}
function pricing(){const k=c();const s=scene;let h=head(k.pTitle,'',k.pLabel);
 if(s==='pricing-loading')h+=`<div role="status"><p>${k.loading}</p><div class="pp-skel" aria-hidden="true"></div></div>`;
 else if(s==='pricing-error')h+=`<div role="alert"><p>${k.loadErr}</p><div class="pg-actions">${btn(k.retry)}</div></div>`;
 else if(s==='pricing-empty')h+=`<p role="status">${k.empty}</p>`;
 else{const auth=['pricing-auth','pricing-pending','pricing-submitted','pricing-unknown','pricing-retired','pricing-checking'].includes(s);
  h+=`<p>${k.pSub}</p>`;
  if(s==='pricing-selected')h+=note(k.review);
  if(s==='pricing-retired')h+=note(k.retired);
  const st=s==='pricing-submitted'?note(k.submitted):s==='pricing-pending'?note(k.pending):s==='pricing-unknown'?`<div class="cg-banner cg-banner--error" role="alert"><span class="cg-banner__title">${k.unknown}</span><div class="pg-actions">${btn(k.checkStatus)}</div></div>`:s==='pricing-checking'?note(k.checkingReq):'';
  h+=`<div id="st">${st}</div>`+plans(k,{auth,sel:s==='pricing-selected'?1:null,pend:s==='pricing-pending'?1:null,dis:['pricing-pending','pricing-submitted','pricing-unknown'].includes(s)})+`<p class="cg-hint">${k.pNote}</p>`+(auth?`<p><a class="pc-link" href="#sp">${k.space}</a></p>`:'')}
 h+=`<p class="pp-notice" role="note">${k.notice}</p>`;return h}
// ---- profesionales
const fl=(id,label,req,help,err,val,ta,type)=>`<div class="cg-field"><label class="cg-label" for="${id}">${label} <span class="cg-hint">(${req?c().req:c().opt})</span></label>${ta?`<textarea class="cg-textarea" id="${id}" style="min-height:6rem" ${err?'aria-invalid="true"':''} aria-describedby="${id}h${err?' '+id+'e':''}">${val||''}</textarea>`:`<input class="cg-input" id="${id}" type="${type||'text'}" value="${val||''}" ${err?'aria-invalid="true"':''} aria-describedby="${id}h${err?' '+id+'e':''}">`}${help?`<span id="${id}h" class="cg-hint">${help}</span>`:`<span id="${id}h"></span>`}${err?`<span id="${id}e" class="cg-error">⚠ ${err}</span>`:''}</div>`;
function pros(){const k=c();const s=scene;
 if(s==='pros-success')return `<section class="cg-card pg-card" aria-labelledby="ok"><h1 class="pg-title" id="ok" tabindex="-1">${k.okTitle}</h1><p role="status">${k.okBody}</p><div class="pg-actions"><a class="cg-btn" href="#home">${k.home}</a></div></section>`;
 const errs=s==='pros-errors',sending=s==='pros-sending';const e=(m)=>errs?m:'';
 const banner=s==='pros-network'?k.network:s==='pros-rate'?k.rate:s==='pros-closed'?k.closed:s==='pros-server'?k.server:errs?k.invalidSummary:'';
 return head(k.title,k.intro,'')+`<form class="cg-card pg-card pp-form" onsubmit="return false" novalidate>${banner?`<div class="cg-banner cg-banner--error" role="alert"><span class="cg-banner__title">${banner}</span></div>`:''}<div class="pp-pair">${fl('n',k.name,1,'',e(k.invalid),errs?'':ph()+' '+k.ex)}${fl('em',k.email,1,'',e(k.emailInvalid),errs?'ana':'ana@ejemplo.invalid','', 'email')}${fl('co',k.country,1,'',e(k.invalid),errs?'':ph()+' '+k.ex)}${fl('pr',k.profession,1,'',e(k.invalid),errs?'':ph()+' '+k.ex)}</div>${fl('li',k.license,0,k.licenseHelp)}${fl('pu',k.profile,0,k.profileHelp,'','','', 'url')}${fl('ms',k.message,0,k.messageHelp,'','',1)}
 <div class="cg-field"><label class="cg-label" for="cv">${k.cv} <span class="cg-hint">(${k.req})</span></label><input class="cg-input" id="cv" type="file" accept="application/pdf,.pdf" ${errs?'aria-invalid="true"':''} aria-describedby="cvh${errs?' cve':''}"><span id="cvh" class="cg-hint">${k.cvHelp}</span>${errs?`<span id="cve" class="cg-error">⚠ ${k.cvRequired}</span>`:`<p class="cg-hint" role="status">${k.cvChosen}: cv-ejemplo.pdf (240 KB) <button type="button" class="cg-linkbtn">${k.cvRemove}</button></p>`}</div>
 <div class="cg-field"><label class="pc-check" for="cs"><input id="cs" type="checkbox" ${errs?'aria-invalid="true" aria-describedby="cse"':'checked'}><span>${k.consent}</span></label>${errs?`<span id="cse" class="cg-error">⚠ ${k.consentRequired}</span>`:''}</div>
 <p class="cg-hint">${k.proNotice}</p><div class="pg-actions">${btn(sending?k.sending:k.submit,'',sending?'disabled aria-busy="true"':'')}</div></form>`}
function sc(){const h=scene.startsWith('pricing')?pricing():pros();return pubFrame(h)}

function render(){q('root').innerHTML=sc();document.documentElement.lang=lang;const dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.style.background=dark?'#0e1613':'#e7ece8'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-lang],[data-theme-set]');if(!t)return;if(t.dataset.lang){lang=t.dataset.lang;q('lang').value=lang}else{theme=t.dataset.themeSet;q('theme').value=theme}render()});
q('scene').onchange=e=>{scene=e.target.value;render()};q('lang').onchange=e=>{lang=e.target.value;render()};q('theme').onchange=e=>{theme=e.target.value;render()};
const hh=new URLSearchParams(location.hash.slice(1));if(hh.get('scene')){scene=hh.get('scene');q('scene').value=scene}if(hh.get('lang')){lang=hh.get('lang');q('lang').value=lang}if(hh.get('theme')){theme=hh.get('theme');q('theme').value=theme}
render();
</script>
</body>
</html>
