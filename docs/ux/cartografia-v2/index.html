<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevation · Cartografía v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Spectral:ital,wght@1,400;1,500&display=swap">
<style>
/* Cartografía v2. El relieve es el nivel: donde la persona registra un nivel con evidencia el terreno sube;
   lo que no tiene respaldo queda plano. Cada línea gruesa de nivel es un nivel registrado (1 a 4).
   Color: hoja de mapa gris verdosa, curvas siena y una sola marca bermellón («tú estás aquí», lo que espera respuesta). */
:root{
  --ground:#E7ECE8; --panel:#F2F5F2; --ink:#14201C; --muted:#475550; --line:#B9C3BD;
  --contour:#8F5A33; --contour-soft:rgba(143,90,51,.38); --mark:#B72D0A; --err:#B72D0A; --good:#1F5F46;
  --cond:'Barlow Condensed',system-ui,sans-serif; --sans:'Barlow',system-ui,sans-serif; --name:'Spectral',Georgia,serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1613; --panel:#15201C; --ink:#E9EFEB; --muted:#9DAAA4; --line:#2A3832;
  --contour:#C9976A; --contour-soft:rgba(201,151,106,.4); --mark:#FF6B3F; --err:#FF6B3F; --good:#7DD3A8; color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0E1613;--panel:#15201C;--ink:#E9EFEB;--muted:#9DAAA4;--line:#2A3832;--contour:#C9976A;--contour-soft:rgba(201,151,106,.4);--mark:#FF6B3F;--err:#FF6B3F;--good:#7DD3A8;color-scheme:dark}
/* Prueba de color de marca (selector del prototipo). El error conserva su rojo (--err). */
:root[data-mark="azul"]{--mark:#1D4F91}
:root[data-mark="ocre"]{--mark:#8C6A00}
:root[data-mark="verde"]{--mark:#0E6B63}
@media (prefers-color-scheme:dark){:root[data-mark="azul"]:not([data-theme="light"]){--mark:#7FB0E8}:root[data-mark="ocre"]:not([data-theme="light"]){--mark:#E0AE3B}:root[data-mark="verde"]:not([data-theme="light"]){--mark:#5FD0C2}}
:root[data-theme="dark"][data-mark="azul"]{--mark:#7FB0E8}
:root[data-theme="dark"][data-mark="ocre"]{--mark:#E0AE3B}
:root[data-theme="dark"][data-mark="verde"]{--mark:#5FD0C2}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 1.0625rem/1.55 var(--sans);padding-left:var(--gut);padding-right:var(--gutr)}
button,textarea,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
.sr{position:absolute;left:-9999px}
.wrap{max-width:1240px;margin:0 auto}
.proto{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.5rem 0;border-bottom:1px solid var(--line);font:600 .75rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.proto b{color:var(--ink);margin-right:auto}
.proto select,.proto button{background:var(--panel);border:1px solid var(--line);padding:.25rem .5rem;font:600 .75rem var(--cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
header.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;flex-wrap:wrap}
.brand{font:700 1.7rem var(--cond);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;color:var(--mark)}
nav.main{display:flex;gap:1.3rem;font:600 .95rem var(--cond);letter-spacing:.08em;text-transform:uppercase;align-items:center;flex-wrap:wrap}
nav.main a{color:var(--ink);text-decoration:none;border-bottom:3px solid transparent;padding:.15rem 0}
nav.main a:hover{border-color:var(--mark)}
nav.main a[aria-current="page"]{border-color:var(--ink)}
.who{font:italic 500 1rem var(--name);text-transform:none;letter-spacing:0;color:var(--muted)}
h1{font:700 clamp(3rem,10vw,8.2rem)/.9 var(--cond);text-transform:uppercase;letter-spacing:.005em;margin:0;max-width:11ch}
h1 em{font:italic 500 .88em/1 var(--name);text-transform:none;letter-spacing:-.01em}
h1.s{font-size:clamp(2.2rem,6vw,4rem);max-width:none;line-height:.95}
h2{font:700 1.7rem/1 var(--cond);text-transform:uppercase;letter-spacing:.02em;margin:0}
.nm{font:italic 500 clamp(1.6rem,3.4vw,2.4rem)/1.05 var(--name);margin:0}
.tag{font:600 .78rem var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55rem 1.2rem;background:var(--ink);color:var(--ground);border:0;font:700 1rem var(--cond);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--mark);color:#fff}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:none;color:var(--mark);box-shadow:inset 0 0 0 1.5px var(--mark)}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--ink)}
.lnk{background:none;border:0;border-bottom:1.5px solid var(--mark);padding:.1rem 0;font-weight:600;cursor:pointer}
.chip{display:inline-block;border:1px solid var(--line);padding:.05rem .45rem;font:600 .72rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip.ok{border-color:var(--good);color:var(--good)}.chip.wait{border-color:var(--mark);color:var(--mark)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
.muted{color:var(--muted)}.small{font-size:.88rem}
.protoNote{border:1.5px dashed var(--muted);padding:.6rem .8rem;font-size:.85rem;color:var(--muted);margin-top:1rem}
.protoNote b{font:600 .72rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:block}
footer.f{padding:1.2rem 0 2rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:2rem}

/* formularios */
.fld{display:grid;gap:.3rem;margin-top:1rem}
.fld label,.fld legend{font:600 .85rem var(--cond);letter-spacing:.1em;text-transform:uppercase}
.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld select,textarea{width:100%;padding:.7rem .8rem;background:var(--panel);border:1.5px solid var(--ink);border-radius:0}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.fld small{color:var(--muted);font-size:.82rem}
.check{display:flex;gap:.7rem;align-items:flex-start;margin-top:1rem}
.check input{width:22px;height:22px;margin:.1rem 0 0;accent-color:var(--ink);flex:none}
.err{color:var(--err);font-size:.88rem}
.banner{border:1.5px solid var(--ink);padding:.8rem 1rem;background:var(--panel);margin:1rem 0}
.banner.bad{border-color:var(--err)}
.banner b{display:block}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:.6rem 1.1rem;font-weight:600;z-index:20;max-width:90vw}
.toast[hidden]{display:none}

/* portada */
.hero{position:relative;margin:0 calc(var(--gut) * -1) 0 calc(var(--gutr) * -1);min-height:min(74vh,700px);border-bottom:2px solid var(--ink);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:clamp(1.5rem,5vw,3.5rem) var(--gut) 2.5rem;max-width:1240px;margin:0 auto}
.hero p.lead{max-width:34rem;font-size:1.2rem;margin:1.4rem 0 0;background:var(--ground);display:inline-block;padding:.3rem .5rem .3rem 0}
.here{position:absolute;right:max(8%,16px);top:46%;display:flex;align-items:center;gap:.5rem;font:600 .85rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--mark)}
.here i{width:14px;height:14px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 5px color-mix(in srgb,var(--mark) 22%,transparent)}
.legend{position:absolute;right:var(--gutr);bottom:1rem;background:var(--panel);border:1.5px solid var(--ink);padding:.8rem 1rem;font-size:.85rem;max-width:20rem}
.legend ul{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.35rem}
.legend li{display:flex;gap:.6rem;align-items:center}
.sym{width:14px;height:14px;flex:none;display:inline-block;border-radius:50%}
.sym.s{background:var(--ink)}.sym.p{border:2px dashed var(--mark)}.sym.n{border:1.5px solid var(--muted)}
.sym.l{border-radius:0;height:0;border-top:3px solid var(--contour);width:18px}
.try{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2.5rem;padding:2.5rem 0}
.card{background:var(--panel);border:1.5px solid var(--ink);padding:1rem 1.1rem}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink)}
.steps>div{padding:1rem 1rem 1.4rem 0;border-right:1px solid var(--line)}.steps>div+div{padding-left:1rem}.steps>div:last-child{border:0}
.slot{margin:2rem 0;aspect-ratio:21/6;border:1.5px dashed var(--muted);display:grid;place-items:center;text-align:center;padding:1rem;font:500 .95rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* mapa */
.sheet{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1.6rem;padding:1.2rem 0 1rem}
.mapbox{position:relative;border:2px solid var(--ink);background:var(--ground);aspect-ratio:16/11}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%}
.place{position:absolute;transform:translate(-8px,-8px);display:flex;align-items:center;gap:.45rem;background:none;border:0;padding:.2rem;cursor:pointer;text-align:left}
.place.r{flex-direction:row-reverse;transform:translate(calc(-100% + 8px),-8px);text-align:right}
.mapbox{overflow:hidden}
.place .sym{background:var(--ground)}.place .sym.s{background:var(--ink)}
.place .lb{font:italic 500 .98rem/1.1 var(--name);background:color-mix(in srgb,var(--ground) 82%,transparent);padding:0 .25rem}
.place[aria-pressed="true"] .lb{outline:2px solid var(--mark)}
.title-block{display:grid;grid-template-columns:repeat(3,auto);gap:.2rem 1.4rem;margin-top:.8rem;font-size:.8rem;color:var(--muted);justify-content:start}
.title-block b{color:var(--ink);font-weight:600;display:block}
.field{padding:1.1rem 1.2rem;background:var(--panel);border:2px solid var(--ink);align-self:start;position:sticky;top:1rem}
.rowx{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;margin:.6rem 0}
.ticks{display:inline-flex;gap:4px}.ticks i{width:16px;height:6px;background:var(--line);display:block}.ticks i.f{background:var(--contour)}
.opts{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.opts label{border:1.5px solid var(--ink);padding:.3rem .9rem;font:700 1rem var(--cond);cursor:pointer;position:relative}
.opts input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opts label:has(input:checked){background:var(--ink);color:var(--ground)}
.opts label:has(input:focus-visible){outline:3px solid var(--mark);outline-offset:2px}

/* evidencias */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:2rem;padding:1.2rem 0}
.item{border-top:1px solid var(--line);padding:.9rem 0;display:grid;gap:.4rem}
.item:first-of-type{border-top:2px solid var(--ink)}
.item .top{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:baseline}
.item q{font-family:var(--name);font-style:italic;font-size:1.1rem;quotes:'«' '»'}
.review{border:2px solid var(--ink);padding:1rem;background:var(--panel);margin-top:.6rem}

/* conversación */
.log{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:2rem;padding:1.4rem 0 0}
.entries{max-width:44rem}
.entry{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:1rem;padding:1rem 0;border-top:1px solid var(--line)}
.entry .t{font:600 .78rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.entry.ai>p,.entry.ai>div>p:first-child{font:italic 500 1.25rem/1.4 var(--name);margin:0}
.entry.me p{margin:0;font-size:1.05rem}
.entry.unsent p{color:var(--muted)}
.pista{margin-top:.8rem;border:1.5px dashed var(--mark);padding:.8rem 1rem;background:var(--panel)}
.pista p{font:400 1rem/1.5 var(--sans);margin:.3rem 0 0}
.composer{position:sticky;bottom:0;background:var(--ground);border-top:2px solid var(--ink);padding:.8rem 0 calc(.8rem + env(safe-area-inset-bottom,0px));margin-top:1rem}
.composer .row{margin:0;align-items:flex-end}.composer textarea{min-height:56px;flex:1}
.mini{position:sticky;top:1rem;align-self:start}.mini .mapbox{aspect-ratio:1/1}

/* planes y estados */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem;margin-top:1rem}
.plan{border:2px solid var(--ink);padding:1.1rem 1.2rem;background:var(--panel)}
.plan ul{margin:.6rem 0;padding-left:1.1rem}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem;margin-top:1rem}
.gal>section{border:1.5px solid var(--ink);padding:1rem;background:var(--panel)}
.flat{height:120px;border:1.5px dashed var(--line);margin:.6rem 0;display:grid;place-items:center;color:var(--muted);font:600 .8rem var(--cond);letter-spacing:.1em;text-transform:uppercase}
.pulse{height:120px;margin:.6rem 0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 14px,var(--contour-soft) 14px 15px);animation:pl 1.6s ease-in-out infinite alternate}
@keyframes pl{from{opacity:.35}to{opacity:1}}
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:3rem;padding:2rem 0;align-items:start}

@media (max-width:900px){
  .try,.sheet,.log,.two,.auth{grid-template-columns:1fr}.plans,.gal{grid-template-columns:1fr}
  .field,.mini{position:static}.steps{grid-template-columns:1fr}.steps>div{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}
  .legend{position:static;margin:0 var(--gutr) 1rem var(--gut)}.here{top:30%}
  .mapbox{aspect-ratio:4/5}.place .lb{font-size:.82rem}.title-block{grid-template-columns:1fr 1fr}
  .entry{grid-template-columns:4rem minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  else if(p.q&&!p.no&&!p.ok)h+='<p class="chip wait">'+t('hint_chip')+'</p><p>'+t('hint_base',{q:t(p.q)})+'</p><div class="row"><button class="lnk" data-act="ok">'+t('yes')+'</button><button class="lnk" data-act="nope">'+t('no')+'</button></div>';
  else if(p.ok)h+='<p class="chip">'+t('noted')+'</p><p>'+t('noted_p')+'</p><fieldset class="fld" style="border:0;padding:0;margin:0"><legend>'+t('lv_lab')+'</legend><div class="opts">'+[1,2,3,4].map(function(n){return'<label><input type="radio" name="lv" value="'+n+'">'+n+'</label>'}).join('')+'</div></fieldset><p class="err" id="lve" role="alert" hidden>'+t('lv_pick')+'</p><div class="row"><button class="btn" data-act="save">'+t('lv_save')+'</button></div><p class="muted small">'+t('lv_help')+'</p>';
  else h+='<p class="chip">'+t('none_chip')+'</p><p>'+t('none_p')+'</p><div class="row"><a class="btn ghost" href="#chat">'+t('none_go')+'</a></div>';
  return h}
V.evidencias=function(){var rows=S.ev.map(function(e){var rv=S.reviewEv===e.id;
  return'<div class="item"><div class="top"><b>'+esc(capName(e.cap))+'</b><span class="chip '+(e.st==='c'?'ok':'wait')+'">'+(e.st==='c'?t('ev_chipc'):t('ev_chipd'))+'</span></div><q>'+esc(e.user?e.txt:t(e.txt))+'</q>'+
  (e.st==='d'&&!rv?'<div class="row" style="margin:0"><button class="btn" data-act="evrev" data-v="'+e.id+'">'+t('ev_review')+'</button></div>':'')+
  (e.st==='c'?'<div class="row" style="margin:0"><a class="lnk" href="#inicio" style="text-decoration:none">'+t('ev_lvl')+'</a></div>':'')+
  (rv?'<div class="review"><b>'+t('ev_rt')+'</b><p style="margin:.3rem 0">'+t('ev_rp')+'</p><div class="row" style="margin:0"><button class="btn" data-act="evok" data-v="'+e.id+'">'+t('ev_conf')+'</button><button class="btn ghost" data-act="evcancel">'+t('ev_edit')+'</button></div></div>':'')+'</div>'}).join('');
  return'<main><div class="two"><section><h1 class="s">'+t('ev_t')+'</h1><p class="muted">'+t('ev_sub')+'</p><div id="evl">'+(rows||'<p class="muted">'+t('ev_empty')+'</p>')+'</div></section>'+
  '<section><h2>'+t('ev_new')+'</h2><form id="f-ev" novalidate><div class="fld"><label for="ec">'+t('ev_cap')+'</label><select id="ec">'+C[S.lang].cap.map(function(n,i){return'<option value="'+i+'">'+esc(n)+'</option>'}).join('')+'</select></div>'+
  '<div class="fld"><label for="ew">'+t('ev_what')+'</label><textarea id="ew" maxlength="500"></textarea><small>'+t('ev_max')+'</small></div><div class="fld"><label for="ed">'+t('ev_did')+'</label><textarea id="ed" maxlength="500"></textarea></div><p class="err" id="eve" role="alert" hidden>'+t('ev_need')+'</p>'+
  '<div class="row"><button class="btn" type="submit">'+t('ev_draft')+'</button></div></form></section></div></main>'};
function turn(c,who,txt,extra){return'<div class="entry '+c+'"><span class="t">'+who+'</span>'+(extra?'<div><p>'+txt+'</p>'+extra+'</div>':'<p>'+txt+'</p>')+'</div>'}
V.chat=function(){var ai=t('who_ai'),me=t('who_me'),h='';
  h+=turn('ai',ai,t('c1'))+turn('me',me+' · 1',esc(t('c2')))+turn('ai',ai,t('c3'))+turn('me',me+' · 2',esc(t('c4')));
  h+=turn('ai',ai,t('c5'),'<div class="pista" id="cp"><p class="tag" style="margin:0">'+t('c5h')+'</p><p>'+(S.hintC==='yes'?t('c_yes'):S.hintC==='no'?t('c_no'):t('c5b'))+'</p>'+(S.hintC==='yes'||S.hintC==='no'?'':'<div class="row"><button class="lnk" data-act="cy">'+t('yes')+'</button><button class="lnk" data-act="cn">'+t('no')+'</button></div>')+'</div>');
  S.chatSent.forEach(function(m,i){h+=turn('me',me+' · '+(i+3),esc(m));h+=turn('ai',ai,esc(t('reply'))+' <span class="chip">'+t('reply_tag')+'</span>')});
  var draft=S.unsent!==null?S.unsent:(ss('elv_draft')||'');
  if(S.unsent!==null)h+='<div class="entry me unsent"><span class="t">'+me+' · '+t('unsent')+'</span><p>'+esc(S.unsent)+'</p></div>';
  var banner='';if(S.unsent!==null){var off=S.mode==='offline';banner='<div class="banner bad" role="alert"><b>'+(off?t('e_off'):t('e_limit'))+'</b>'+(off?t('e_off_p'):t('e_limit_p'))+'<div class="row"><button class="btn" data-act="retry">'+t('retry')+'</button><button class="btn ghost" data-act="copy">'+t('copy')+'</button></div></div>'}
  var m0=S.hintC==='yes'?t('mini_1'):S.hintC==='no'?t('mini_2'):t('mini_0');
  return'<main><div class="log"><section aria-labelledby="ct"><p class="tag">'+t('ch_diary')+' · '+t('ch_note')+'</p><h1 class="s" id="ct" style="margin:.3rem 0 1rem">'+t('ch_t')+'</h1><div class="entries" aria-live="polite">'+h+'</div>'+banner+
  '<form class="composer" id="cf"><label class="sr" for="cm">'+t('ph_msg')+'</label><div class="row"><textarea id="cm" maxlength="500" placeholder="'+esc(t('ph_msg'))+'">'+esc(S.unsent!==null?'':draft)+'</textarea><button class="btn" type="submit">'+t('send')+'</button></div><p class="muted small" style="margin:.5rem 0 0">'+t('priv_chat')+'</p></form></section>'+
  '<aside class="mini" aria-label="'+t('mini_t')+'"><p class="tag">'+t('mini_t')+'</p><div class="mapbox"><canvas id="c-chat" aria-hidden="true"></canvas>'+P.map(function(p){var st=p.lv?'s':(p.id===5?'p':'n');return'<span class="place'+(p.x>.55?' r':'')+'" style="left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;pointer-events:none"><i class="sym '+st+'"></i>'+(p.id===5||p.id===3?'<span class="lb">'+esc(capName(p.id))+'</span>':'')+'</span>'}).join('')+'</div><p class="muted small" style="margin:.5rem 0 0">'+m0+'</p></aside></div></main>'};
var PLANS=[1,2];
V.planes=function(){var h='<main><div style="padding:1.2rem 0"><h1 class="s">'+t('pl_t')+'</h1>';
  if(S.plan==='review')h+='<div class="banner" role="status"><b>'+t('pl_rev')+' · '+t('pl_ex')+' '+S.review+'</b>'+t('pl_revp')+'<div class="row"><button class="btn ghost" data-act="plcancel">'+t('pl_cancel')+'</button></div></div>';
  else h+='<p class="muted">'+t('pl_none')+'</p>';
  if(S.planReview){h+='<div class="review" role="group" aria-labelledby="rvt"><b id="rvt">'+t('pl_rv_t')+'</b><ul><li>'+t('pl_rv1',{p:t('pl_ex')+' '+S.planReview})+'</li><li>'+t('pl_rv2')+'</li><li>'+t('pl_rv3')+'</li></ul><div class="row" style="margin:0"><button class="btn" data-act="plsend">'+t('pl_send')+'</button><button class="btn ghost" data-act="plback">'+t('pl_back')+'</button></div></div>'}
  h+='<div class="plans">'+PLANS.map(function(n){return'<article class="plan"><span class="chip">'+t('ex')+'</span><p class="nm" style="margin-top:.4rem">'+t('pl_ex')+' '+n+'</p><ul><li>'+t('pl_f1')+'</li><li>'+t('pl_f2')+'</li></ul><button class="btn ghost" data-act="plreq" data-v="'+n+'" '+(S.plan==='review'?'disabled':'')+'>'+t('pl_req')+'</button></article>'}).join('')+'</div>';
  h+='<div class="protoNote"><b>'+t('pn_pay')+'</b>'+t('pn_pay_p')+'<br>'+t('pn_cancel_p')+'</div></div></main>';return h};
V.estados=function(){return'<main><div style="padding:1.2rem 0"><h1 class="s">'+t('s_t')+'</h1><p class="muted">'+t('s_sub')+'</p><div class="gal">'+
 '<section><span class="tag">'+t('s_limit')+'</span><div class="banner bad" role="note"><b>'+t('e_limit')+'</b>'+t('e_limit_p')+'<div class="row"><span class="btn">'+t('retry')+'</span><span class="btn ghost">'+t('copy')+'</span></div></div></section>'+
 '<section><span class="tag">'+t('s_off')+'</span><div class="banner bad" role="note"><b>'+t('e_off')+'</b>'+t('e_off_p')+'</div></section>'+
 '<section><span class="tag">'+t('s_empty')+'</span><div class="flat">'+t('s_flat')+'</div><p style="margin:0">'+t('s_empty_p')+'</p></section>'+
 '<section><span class="tag">'+t('s_load')+'</span><div class="pulse" role="img" aria-label="'+t('s_load_p')+'"></div><p style="margin:0">'+t('s_load_p')+'</p></section></div></div></main>'};
/* ================= render ================= */
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){e.hidden=true},2600)}
function render(keepFocus){live=[];if(ro)ro.disconnect();var app=document.getElementById('app');
  app.innerHTML=header()+(V[S.route]||V.portada)()+(PUB.indexOf(S.route)>-1||S.route==='inicio'||S.route==='evidencias'||S.route==='planes'||S.route==='estados'||S.route==='chat'?footer():'');
  document.documentElement.lang=S.lang;document.title='Elevation · '+C[S.lang].routes[S.route];
  var rt=document.getElementById('rt');rt.innerHTML=ROUTES.map(function(r){return'<option value="'+r+'"'+(r===S.route?' selected':'')+'>'+C[S.lang].routes[r]+'</option>'}).join('');
  document.getElementById('lg').textContent=S.lang==='es'?'EN':'ES';
  bindCanvas('c-hero',true);bindCanvas('c-home',false);bindCanvas('c-chat',false);drawAll();
  var cm=document.getElementById('cm');if(cm)cm.addEventListener('input',function(){ss('elv_draft',cm.value)})}
function go(r){if(ROUTES.indexOf(r)<0)r='portada';S.route=r;render();window.scrollTo(0,0)}
function route(){go((location.hash||'').slice(1))}
window.addEventListener('hashchange',route);
document.getElementById('rt').addEventListener('change',function(e){location.hash=e.target.value});
(function(){var m=document.getElementById('mk'),q=(location.search.match(/[?&]color=(\w+)/)||[])[1];
  function ap(v){document.documentElement.setAttribute('data-mark',v);render()}
  if(q&&m.querySelector('option[value="'+q+'"]'))m.value=q;
  document.documentElement.setAttribute('data-mark',m.value);
  m.addEventListener('change',function(){ap(m.value)})})();
document.getElementById('lg').addEventListener('click',function(){S.lang=S.lang==='es'?'en':'es';render()});
document.getElementById('md').addEventListener('change',function(e){S.mode=e.target.value});
document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v;
  if(a==='mark'){S.hintC='open';S.demo=false;render()}
  else if(a==='hy'){S.hintC='accepted';render()}else if(a==='hn'){S.hintC=null;render()}
  else if(a==='see'){S.demo=true;var p=P[5];render();raise(p,.25)}
  else if(a==='pick'){S.selId=+v;render();var f=document.querySelector('.field');if(f&&window.innerWidth<900)f.scrollIntoView({block:'nearest'})}
  else if(a==='ok'){P[S.selId].ok=true;render()}else if(a==='nope'){P[S.selId].no=true;render()}
  else if(a==='save'){var r=document.querySelector('input[name=lv]:checked');if(!r){document.getElementById('lve').hidden=false;return}var p2=P[S.selId];p2.lv=+r.value;p2.fr=[p2.q];p2.ok=false;render();raise(p2,p2.lv*.25)}
  else if(a==='evrev'){S.reviewEv=+v;render()}else if(a==='evcancel'){S.reviewEv=null;render()}
  else if(a==='evok'){S.ev.forEach(function(x){if(x.id===+v)x.st='c'});S.reviewEv=null;render();toast(t('ev_confd'))}
  else if(a==='cy'){S.hintC='yes';render()}else if(a==='cn'){S.hintC='no';render()}
  else if(a==='retry'){if(S.mode!=='ok'){toast(S.mode==='offline'?t('e_off'):t('e_limit'));return}S.chatSent.push(S.unsent);S.unsent=null;ss('elv_draft','');render()}
  else if(a==='copy'){try{navigator.clipboard.writeText(S.unsent).then(function(){toast(t('copied'))},function(){toast(t('copied'))})}catch(x){toast(t('copied'))}}
  else if(a==='plreq'){S.planReview=v;render()}else if(a==='plback'){S.planReview=null;render()}
  else if(a==='plsend'){S.plan='review';S.review=S.planReview;S.planReview=null;render();toast(t('pl_sent'))}
  else if(a==='plcancel'){S.plan='none';S.review=null;render();toast(t('pl_canceled'))}});
document.getElementById('app').addEventListener('submit',function(e){e.preventDefault();var id=e.target.id;
  if(id==='f-reg'){if(!document.getElementById('rc').checked){var er=document.getElementById('rce');er.hidden=false;document.getElementById('rc').focus();return}S.signed=true;render()}
  else if(id==='f-in'){location.hash='inicio'}
  else if(id==='f-rc'){S.rcSent=true;render()}
  else if(id==='f-ev'){var w=document.getElementById('ew').value.trim();if(!w){document.getElementById('eve').hidden=false;document.getElementById('ew').focus();return}
    S.ev.unshift({id:++S.evSeq+1,cap:+document.getElementById('ec').value,txt:w,st:'d',user:true});render();toast(t('ev_saved'))}
  else if(id==='cf'){var cm=document.getElementById('cm'),m=cm.value.trim();if(!m)return;
    if(S.mode==='ok'){S.chatSent.push(m);S.unsent=null;ss('elv_draft','')}else{S.unsent=m;ss('elv_draft',m)}render()}});
document.getElementById('app').addEventListener('change',function(e){if(e.target.id==='ps'){S.pw=e.target.checked;var v=document.getElementById('ip').value;render();document.getElementById('ip').value=v;document.getElementById('ps').focus()}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawAll);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawAll);
route();
})();
</script>
