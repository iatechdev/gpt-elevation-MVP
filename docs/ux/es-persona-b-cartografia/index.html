const q=id=>document.getElementById(id);let lang='es',theme='system',scene='evidence';const c=()=>S[lang];

const themeSw=()=>`<div class="cg-seg" role="group" aria-label="${c().theme}">${[['system','tsys'],['light','tlight'],['dark','tdark']].map(([v,k])=>`<button type="button" aria-pressed="${theme===v}" data-theme-set="${v}">${c()[k]}</button>`).join('')}</div>`;
const prefs=()=>`<div class="cg-prefs" role="group" aria-label="${c().prefs}"><span class="cg-only-narrow cg-prefs__group"><span>${c().lang}</span>${langSw()}</span><span class="cg-prefs__group"><span>${c().theme}</span>${themeSw()}</span></div><footer class="cg-footer"><span>${c().foot1}</span><span>${c().foot2}</span></footer>`;
function frame(inner,{active=null,here=false}={}){const k=c();return `<div class="cg cg-frame" ${theme==='system'?'':`data-theme="${theme}"`}><a class="cg-skip" href="#main">${k.skip}</a>
 <header class="cg-header cg-header--person"><a class="cg-brand" href="#h" aria-label="Elevation">Elevation<i>.</i></a>
 <nav class="cg-nav" aria-label="${k.main}">${k.nav.map((n,i)=>`<a href="#n${i}" ${active===i?'aria-current="page"':''}>${n}</a>`).join('')}</nav>
 <div class="cg-header__end">${langSw()}<button type="button" class="cg-usermenu__button${here?' is-here':''}" aria-expanded="false" aria-label="${k.menu}: Ana ${k.ex}"><span>Ana</span><span aria-hidden="true"> ▾</span></button></div></header>
 <div class="cg-body"><main id="main" tabindex="-1" class="cg-main">${inner}</main></div>${prefs()}</div>`}
const head=(title,lead,tag)=>`<header class="pg-head">${tag?`<p class="cg-tag">${tag}</p>`:''}<h1 class="pg-title">${title}</h1>${lead?`<p class="pg-lead">${lead}</p>`:''}</header>`;
const card=(title,body,id)=>`<section class="cg-card pg-card" ${id?`aria-labelledby="${id}"`:''}><h2 ${id?`id="${id}"`:''}>${title}</h2>${body}</section>`;
const dlg=(title,inner,acts)=>`<div class="cg-scrim"><div class="cg-dialog" role="dialog" aria-modal="true" aria-labelledby="dg"><h2 id="dg" class="pg-card" style="font:700 1.35rem var(--cg-font-cond);text-transform:uppercase;margin:0 0 .6rem">${title}</h2>${inner}<div class="cg-dialog__actions">${acts}</div></div></div>`;
const btn=(t,cl='')=>`<button type="button" class="cg-btn ${cl}">${t}</button>`;
const fld=(id,label,val,ta)=>`<div class="cg-field"><label class="cg-label" for="${id}">${label}</label>${ta?`<textarea class="cg-textarea" id="${id}" style="min-height:5rem">${val}</textarea>`:`<input class="cg-input" id="${id}" value="${val}">`}</div>`;
const note=(t,err)=>`<div class="cg-banner${err?' cg-banner--error':''}" ${err?'role="alert"':'role="note"'}><span class="cg-banner__title">${t}</span></div>`;
function sc(){const k=c();let h='',a=2,here=false;
 if(scene==='evidence'){h=head(k.eTitle,k.eIntro+' '+k.ePriv,'')+`<div class="pg-actions" style="margin:0 0 1rem">${btn(k.eNew)}</div><fieldset class="cg-field" style="max-width:46rem"><legend class="cg-label">${k.fStatus}</legend><div class="pg-radios"><label><input type="radio" name="f" checked>${k.fAll}</label><label><input type="radio" name="f">${k.draft}</label><label><input type="radio" name="f">${k.confirmed}</label></div></fieldset><p class="cg-hint" role="status" style="margin:.6rem 0">${k.fCount}</p><div class="pg-stack">${[['confirmed','cg-chip--ok'],['draft','']].map(([s,cl],i)=>`<article class="cg-card pg-card"><div style="display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:baseline"><h2 style="margin:0">${lang==='es'?'Título de la evidencia':'Evidence title'} ${i+1} ${k.ex}</h2><span class="cg-chip ${cl}">${s==='confirmed'?'✓ '+k.confirmed:k.draft}</span></div><div class="pg-actions"><a class="cg-btn cg-btn--ghost" href="#d">${k.detail}</a>${btn(k.eEdit,'cg-btn--ghost')}${btn(k.eDel,'cg-btn--ghost')}</div></article>`).join('')}</div>`}
 if(scene==='evidence-delete'){h=head(k.eTitle,k.eIntro+' '+k.ePriv,'')+`<div class="pg-stack"><article class="cg-card pg-card"><h2>${lang==='es'?'Título de la evidencia':'Evidence title'} 1 ${k.ex}</h2><div class="pg-actions">${btn(k.eDel,'cg-btn--ghost')}</div></article></div>`+dlg(k.delTitle,`<p>${k.delBody}</p>`,btn(k.cancel,'cg-btn--ghost')+btn(k.delYes,'cg-btn--danger'))}
 if(scene.startsWith('evidence-new')||scene==='evidence-review'||scene==='evidence-uncertain'){const rev=scene==='evidence-review'||scene==='evidence-uncertain';h=head(k.eNew,k.eIntro+' '+k.ePriv,'')+`<div class="pg-stack"><section class="cg-card pg-card">`+(rev?`<h2>${k.review}</h2><p>${k.warning}</p><dl style="margin:.6rem 0"><dt class="cg-tag">${k.fTitle}</dt><dd style="margin:0 0 .5rem">${lang==='es'?'Título de ejemplo':'Example title'} ${k.ex}</dd><dt class="cg-tag">${k.goal}</dt><dd style="margin:0 0 .5rem">${lang==='es'?'Texto de ejemplo':'Example text'} ${k.ex}</dd></dl><label class="cg-check" style="display:flex;gap:.7rem;align-items:flex-start;min-height:var(--cg-touch)"><input type="checkbox" checked style="width:1.4rem;height:1.4rem;accent-color:var(--cg-ink)"><span>${k.reviewed}</span></label><p class="cg-hint">${k.reviewNote}</p>`+(scene==='evidence-uncertain'?note(k.uncertain,true)+`<div class="pg-actions">${btn(k.retry)}${btn(k.keepEdit,'cg-btn--ghost')}</div>`:`<div class="pg-actions">${btn(k.confirm)}${btn(k.keepEdit,'cg-btn--ghost')}</div>`):`<h2>${k.eNew}</h2><span class="cg-chip">${k.required}</span>`+fld('t',k.fTitle,'',0)+fld('s',k.situation,'',1)+fld('r',k.resp,'',1)+fld('a',k.actions,'',1)+`<div class="pg-actions" style="margin-top:.4rem"><button type="button" class="cg-linkbtn">${k.addAction}</button></div>`+fld('g',k.goal,'',1)+fld('d',k.delivered,'',1)+fld('e',k.effect,'',1)+fld('l',k.learning,'',1)+`<fieldset class="cg-field"><legend class="cg-label">${k.autonomy}</legend><div class="pg-radios">${k.autoOpts.map((o,i)=>`<label><input type="radio" name="au" ${i===0?'checked':''}>${o}</label>`).join('')}</div><p class="cg-hint">${k.autoHelp}</p></fieldset><div class="pg-actions">${btn(k.saveDraft,'cg-btn--ghost')}${btn(k.review)}</div>`)+`</section></div>`}
 if(scene.startsWith('resumes')){a=null;here=true;h=head(k.rTitle,k.rPriv)+`<div class="pg-stack">`+card(k.rVersions+' · '+k.rCount,`<ul class="cg-items" style="margin-top:.4rem">${[2,1].map(n=>`<li class="cg-item"><div style="display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:baseline"><strong>${k.rVersion} ${n} · 2026-11-0${n} ${k.ex}</strong>${n===2?`<span class="cg-chip cg-chip--ok">✓ ${k.rCurrent}</span>`:''}</div><div class="pg-actions" style="margin-top:.2rem">${btn(k.rView,'cg-btn--ghost')}${btn(k.rDownload,'cg-btn--ghost')}${btn(k.rDelete,'cg-btn--ghost')}</div></li>`).join('')}</ul><div class="pg-actions">${btn(k.rUpload)}</div>`,'rv')+card(k.wTitle,`<p>${k.wBody}</p><div class="pg-actions">${btn(k.wBtn,'cg-btn--danger')}</div>`,'rw')+`</div>`+(scene==='resumes-delete'?dlg(k.rDelTitle,`<p>${k.rDelBody}</p>`,btn(k.cancel,'cg-btn--ghost')+btn(k.rDelYes,'cg-btn--danger')):'')}
 if(scene==='resume-skills'){a=2;h=head(k.sTitle,k.sIntro)+`<div class="pg-stack"><p class="cg-hint">${k.sNone}</p><ul class="cg-items">${[[1,1],[0,0]].map(([on],i)=>`<li class="cg-item"><label class="pg-pick"><input type="checkbox" ${i===0?'checked':''}><span><strong>${lang==='es'?'Habilidad de ejemplo':'Example skill'} ${i+1} ${k.ex}</strong></span></label><div style="display:flex;gap:.5rem;flex-wrap:wrap"><span class="cg-chip">${k.sDeclared}</span><span class="cg-chip">${k.sNoLevel}</span><span class="cg-hint">${k.sSource}</span></div></li>`).join('')}</ul><p class="cg-hint" role="status">${k.sCount}</p><div class="pg-actions">${btn(k.sReview)}</div></div>`}
 if(scene.startsWith('compass')){a=null;here=true;const prev=scene==='compass-preview',unc=scene==='compass-uncertain';h=head(k.cTitle,k.cIntro+' '+k.cPriv,'')+`<div class="pg-stack"><p class="cg-hint">${k.cCaution}</p>`+card(k.cCurrent,`<p><span class="cg-chip cg-chip--ok">✓ ${k.cActive}</span> <span class="cg-hint">${k.cVersion} 2 ${k.ex}</span></p><p><strong>${k.cMot}:</strong> ${lang==='es'?'Texto de ejemplo':'Example text'} ${k.ex}</p><div class="pg-actions"><button type="button" class="cg-linkbtn">${k.cHistory}</button>${btn(k.cWithdraw,'cg-btn--ghost')}</div>`,'cc')+card(k.cNew,`<p class="cg-hint">${k.cLimit}</p>`+(prev||unc?`<p class="cg-hint">${k.cExpires}: 10:42</p><dl style="margin:.4rem 0"><dt class="cg-tag">${k.cMot}</dt><dd style="margin:0 0 .5rem">${lang==='es'?'Texto de ejemplo':'Example text'} ${k.ex}</dd></dl>${note(k.cReplaces)}<label class="cg-check" style="display:flex;gap:.7rem;align-items:flex-start;min-height:var(--cg-touch)"><input type="checkbox" checked style="width:1.4rem;height:1.4rem;accent-color:var(--cg-ink)"><span>${k.cAuth}</span></label>`+(unc?note(k.cUncertain,true)+`<div class="pg-actions">${btn(k.cCheck,'cg-btn--ghost')}${btn(k.cRetry)}</div>`:`<div class="pg-actions">${btn(k.cEdit,'cg-btn--ghost')}${btn(k.cConfirm)}</div>`):`<div class="cg-field"><label class="cg-label" for="cat">${k.cCategory}</label><select class="cg-input" id="cat"><option>${k.cMot}</option></select></div>${fld('tx',k.cText,'',1)}<label class="cg-check" style="display:flex;gap:.7rem;align-items:flex-start;min-height:var(--cg-touch)"><input type="checkbox" checked style="width:1.4rem;height:1.4rem;accent-color:var(--cg-ink)"><span>${k.cSelect}</span></label><div class="pg-actions">${btn(k.cReject,'cg-btn--ghost')}${btn(k.cAdd,'cg-btn--ghost')}${btn(k.cPreview)}</div>`),'cn')+`</div>`+(scene==='compass-withdraw'?dlg(k.cWTitle,`<p>${k.cWBody}</p>`,btn(k.cancel,'cg-btn--ghost')+btn(k.cWTitle,'cg-btn--danger')):'')}
 return frame(h,{active:a,here})}
function render(){q('root').innerHTML=sc();document.documentElement.lang=lang;const dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.style.background=dark?'#0e1613':'#e7ece8'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-lang],[data-theme-set]');if(!t)return;if(t.dataset.lang){lang=t.dataset.lang;q('lang').value=lang}else{theme=t.dataset.themeSet;q('theme').value=theme}render()});
q('scene').onchange=e=>{scene=e.target.value;render()};q('lang').onchange=e=>{lang=e.target.value;render()};q('theme').onchange=e=>{theme=e.target.value;render()};
const hh=new URLSearchParams(location.hash.slice(1));if(hh.get('scene')){scene=hh.get('scene');q('scene').value=scene}if(hh.get('lang')){lang=hh.get('lang');q('lang').value=lang}if(hh.get('theme')){theme=hh.get('theme');q('theme').value=theme}
render();
</script>
</body>
</html>
