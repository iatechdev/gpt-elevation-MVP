.gf-drawer__body{overflow:auto;padding:0 1rem 1rem;flex:1 1 auto;min-height:0}
.gf-drawer__foot{padding:.7rem 1rem;border-top:1px solid var(--cg-line)}.gf-drawer__foot .cg-btn{width:100%}
.gf-drawer h3{font:600 .8rem var(--cg-font-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--cg-muted);margin:1rem 0 .1rem}
.gf-list{display:grid;margin:.2rem 0}.gf-list a,.gf-list button{display:flex;align-items:center;min-height:var(--cg-touch);padding:0 .5rem;border:0;border-bottom:1px solid var(--cg-line);background:none;color:var(--cg-ink);font:inherit;text-decoration:none;text-align:left;cursor:pointer}
.gf-list a[aria-current='page']{font-weight:700;box-shadow:inset 4px 0 0 var(--cg-mark);padding-left:.8rem}
.gf-prefs{display:grid;gap:.5rem;margin:.4rem 0}.gf-prefs>div{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.gf-prefs span{min-width:4.5rem}
.gf-prefs .cg-seg button[aria-pressed='true']::before,.gf-pop .cg-lang__btn[aria-pressed='true']::before{content:'✓ '}
.gf .cg-lang__btn[aria-pressed='true']::before{content:'✓ '}
.gf-chatbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;align-items:center;min-height:56px;padding:.2rem .6rem;border-bottom:1px solid var(--cg-line)}
.gf-chatbar h1{font:700 1.05rem/1.1 var(--cg-font-cond);text-transform:uppercase;letter-spacing:.06em;margin:0}.gf-chatbar p{margin:0;font-size:.8rem;color:var(--cg-muted)}
.gf-meter{height:6px;background:var(--cg-line)}.gf-meter i{display:block;height:100%;width:42%;background:var(--cg-mark)}
.gf-thread{padding:1rem;min-height:16rem}.gf-comp{display:flex;gap:.6rem;padding:.6rem 1rem 1rem}.gf-comp .cg-textarea{min-height:var(--cg-touch);flex:1}
.gf-sess{margin:1rem 0}
.gf-st a,.gf-st span.l{display:flex;align-items:center;min-height:2.5rem;padding:.2rem .6rem;border-bottom:1px solid var(--cg-line);color:var(--cg-ink);text-decoration:none}
.gf-st .hv{background:var(--cg-panel);box-shadow:inset 0 -3px 0 var(--cg-mark)}.gf-st .fc{outline:3px solid var(--cg-mark);outline-offset:-3px}.gf-st .cu{font-weight:700;box-shadow:inset 4px 0 0 var(--cg-mark);padding-left:.8rem}.gf-st .dis{color:var(--cg-muted);text-decoration:line-through}
@media (max-width:900px){.gf-top{padding:.2rem .8rem;flex-wrap:nowrap}.gf-end--desk{display:none}.gf-brand .gf-chip{display:none}.gf-menubtn{display:inline-flex}.gf-body{grid-template-columns:minmax(0,1fr);gap:0}.gf-side{display:none}.gf-pop{right:.8rem}}
@media (min-width:901px){.gf-menubtn{display:none!important}}
/* NUEVO (ES-303 B) */
.rv-stack{display:grid;gap:1rem;max-width:46rem}
.rv-code{font:700 1.6rem ui-monospace,Consolas,monospace;letter-spacing:.12em;border:2px solid var(--cg-ink);padding:.8rem 1rem;background:var(--cg-panel);overflow-wrap:anywhere;margin:.4rem 0}
.rv-chk{display:flex;gap:.7rem;align-items:flex-start;min-height:var(--cg-touch);padding:.3rem 0;border-top:1px solid var(--cg-line)}.rv-chk input{width:1.4rem;height:1.4rem;accent-color:var(--cg-ink);flex:none;margin-top:.15rem}
.rv-row{display:grid;gap:.4rem;border-top:1px solid var(--cg-line);padding:.8rem 0}.rv-row__top{display:flex;justify-content:space-between;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.rv-skel{height:1rem;background:var(--cg-line);margin:.6rem 0;max-width:70%}.rv-skel--l{height:3rem;max-width:100%}

.proto label{display:inline-flex;gap:.35rem;align-items:center;max-width:100%}.proto select{font:inherit;min-height:32px;max-width:60vw}.proto b{color:#1d4f91}
