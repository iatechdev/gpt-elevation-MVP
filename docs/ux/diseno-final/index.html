<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevation · Diseño final propuesto (ES-148)</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#e9e7e1;color:var(--ink);font:16px/1.55 var(--font)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* barra de la maqueta (no es producto) */
.deck{position:sticky;top:0;z-index:50;background:#1a1a18;color:#f3f1ea;padding:.5rem 1rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:.9rem}
.deck select,.deck button{min-height:40px;border-radius:8px;border:1px solid #5e5e5a;background:#262622;color:#f3f1ea;font:inherit;padding:0 .75rem;cursor:pointer}
.deck button[aria-pressed=true]{background:#f3f1ea;color:#1a1a18}
.deck .ttl{font-weight:700;margin-right:.5rem}
.ribbon{background:var(--ocre-bg);color:var(--ocre-text);border-bottom:1px solid var(--line);text-align:center;font-size:.85rem;padding:.4rem 1rem}
.stage{display:flex;justify-content:center;padding:1.25rem}
.device{width:100%;max-width:1180px;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgb(0 0 0/.18);position:relative}
.device.m{max-width:393px}
/* ===== Componentes ===== */
a{color:var(--link)}
h1{font:800 clamp(1.6rem,3.2vw,2.1rem)/1.15 var(--font);letter-spacing:-.02em;margin:0}
h2{font:700 1.05rem/1.3 var(--font);margin:0}
p{margin:0}
.sub{color:var(--ink-2)}
.eyebrow{font:500 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.btn{min-height:var(--touch);padding:0 1.15rem;border-radius:var(--r);border:1.5px solid var(--control);background:var(--card);color:var(--ink);font:600 1rem var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;text-align:center}
.btn.p{background:var(--action);color:var(--action-text);border-color:var(--action)}
.btn.q{border-color:transparent;background:transparent;color:var(--link);text-decoration:underline;padding:0 .5rem}
.btn.d{border-color:var(--error);color:var(--error)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.25rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.alert{border:1px solid;border-radius:var(--r);padding:.85rem 1rem;display:flex;gap:.75rem;align-items:flex-start;flex-wrap:wrap}
.alert>div{flex:1 1 15rem}.alert b{display:block}
.alert.err{background:var(--error-bg);border-color:var(--error);color:var(--error)}
.alert.info{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.alert.warn{background:var(--ocre-bg);border-color:var(--ocre-text);color:var(--ocre-text)}
.empty{border:1.5px dashed var(--control);border-radius:var(--r-lg);padding:1.75rem 1.25rem;text-align:center;display:flex;flex-direction:column;gap:.6rem;align-items:center}
.empty p{max-width:34rem;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-weight:600}.field small{color:var(--ink-2)}
.field input,.field select,.field textarea{min-height:var(--touch);border:1.5px solid var(--control);border-radius:var(--r);padding:.6rem .8rem;font:inherit;background:var(--card);color:var(--ink);width:100%}
.field textarea{min-height:6rem;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--control);border-radius:999px;padding:.1rem .7rem;font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.chip.on{border-color:var(--ok);color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--ai)}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.mood button{min-height:5rem;border:1.5px solid var(--control);background:var(--card);border-radius:var(--r);font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.85rem;padding:.25rem}
.mood button span{font-size:1.5rem}
.mood button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tog{width:52px;height:30px;border-radius:99px;border:1.5px solid var(--control);background:var(--surface);position:relative;cursor:pointer;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:.15s}
.tog[aria-checked=true]{background:var(--ok-bg);border-color:var(--ok)}.tog[aria-checked=true] i{left:25px;background:var(--ok)}
.skel{height:.9rem;border-radius:6px;background:linear-gradient(90deg,var(--surface),var(--line),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.demo{border:1.5px dashed var(--ocre);background:var(--ocre-bg);color:var(--ocre-text);font-size:.8rem;border-radius:8px;padding:.15rem .6rem;display:inline-block}
.stepper{display:flex;gap:.4rem}.stepper i{flex:1;height:6px;border-radius:9px;background:var(--line)}.stepper i.on{background:var(--ink)}
/* ===== Shells ===== */
.pub{display:flex;flex-direction:column;min-height:640px}
.pubbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
.brand{font:800 1.3rem var(--font);letter-spacing:-.03em;display:flex;align-items:center;gap:.4rem;color:var(--ink);text-decoration:none}.brand i{width:7px;height:7px;border-radius:50%;background:var(--ocre)}
.lang{display:inline-flex;border:1.5px solid var(--control);border-radius:999px;overflow:hidden}
.lang button{min-height:38px;min-width:46px;border:0;background:transparent;color:var(--ink);font:600 .9rem var(--font);cursor:pointer}.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.app{display:grid;grid-template-columns:15.5rem 1fr;min-height:680px}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:1.1rem;display:flex;flex-direction:column;gap:.2rem}
.rail .brand{margin-bottom:1rem}
.rail a.nv{display:flex;align-items:center;gap:.65rem;min-height:var(--touch);padding:0 .8rem;border-radius:var(--r);color:var(--ink);text-decoration:none;font-weight:500}
.rail a.nv[aria-current=page]{background:var(--card);font-weight:700;box-shadow:inset 3px 0 0 var(--ocre)}
.rail .sep{height:1px;background:var(--line);margin:.5rem 0}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem}
.rolechip{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;align-self:flex-start;margin-bottom:.5rem}
.main{padding:1.75rem 2rem;display:flex;flex-direction:column;gap:1.1rem;min-width:0}
.mtop,.mbar{display:none}
.device.m .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;min-height:760px}
.device.m .rail{display:none}
.device.m .mtop{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.device.m .main{padding:1.1rem 1rem}
.device.m .mbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
.mbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;font-size:.75rem;color:var(--ink);text-decoration:none;gap:2px}
.mbar a[aria-current=page]{font-weight:700;box-shadow:inset 0 3px 0 var(--ocre)}
.mbar .ic{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.device.m .grid2{grid-template-columns:1fr}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.priv{display:inline-flex;gap:.4rem;align-items:center;font-size:.9rem;color:var(--ink-2)}
/* landing */
.hero{padding:3rem 1.5rem 2rem;max-width:62rem;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:1.25rem}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);text-transform:uppercase;line-height:.98;letter-spacing:-.03em;font-weight:800}
.hero h1 u{text-decoration-color:var(--ocre);text-decoration-thickness:6px;text-underline-offset:6px}
.hero .lead{font-size:1.15rem;color:var(--ink-2);max-width:36rem}
.doors{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.device.m .doors,.device.m .steps{grid-template-columns:1fr}
.door{padding:1.4rem;display:flex;flex-direction:column;gap:.5rem;text-decoration:none;color:var(--ink);background:var(--card)}
.door+.door{border-left:1px solid var(--line)}.device.m .door+.door{border-left:0;border-top:1px solid var(--line)}
.door .go{margin-top:.5rem;font-weight:700;color:var(--link);text-decoration:underline}
.sec{max-width:62rem;margin:0 auto;padding:1.5rem;width:100%;display:flex;flex-direction:column;gap:.9rem;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.steps .card b{font:800 1.6rem var(--font);color:var(--ocre-text)}
.device.m .hero{padding:2rem 1rem 1rem}.device.m .sec{padding:1.25rem 1rem}.device.m .pubbar{padding:.8rem 1rem}
/* auth */
.authwrap{display:flex;justify-content:center;padding:2.5rem 1rem}.authwrap .card{width:100%;max-width:26rem;padding:1.6rem}
/* chat */
.bubble{max-width:38rem;padding:1rem 1.1rem;border-radius:var(--r-lg);background:var(--ai-bg);border:1px solid var(--line)}
.bubble .who{font:500 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ai);margin-bottom:.35rem}
.bubble.me{align-self:flex-end;background:var(--surface);border-color:transparent}
.composer{display:flex;gap:.6rem;align-items:flex-end}.composer .field{flex:1}
.device.m .composer{flex-direction:column;align-items:stretch}
/* mapa */
.row{display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.device.m .row{grid-template-columns:1fr}
.pips{display:inline-flex;gap:4px;vertical-align:middle}.pips i{width:22px;height:13px;border:1.5px dashed var(--control);border-radius:3px}.pips i.f{border:1.5px solid var(--ocre-text);background:var(--ocre-text)}
.seg{display:inline-flex;border:1.5px solid var(--control);border-radius:var(--r);overflow:hidden}.seg button{min-height:40px;padding:0 .9rem;border:0;background:transparent;color:var(--ink);font:600 .9rem var(--font);cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.radar{width:100%;max-width:340px;margin:0 auto;display:block}
/* tabla admin */
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem .6rem;border-top:1px solid var(--line)}th{font:500 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border-top:0}
.ucards{display:none;flex-direction:column;gap:.75rem}
.device.m table{display:none}.device.m .ucards{display:flex}
.modal{position:absolute;inset:0;background:rgb(0 0 0/.5);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:30}
.modal .card{max-width:26rem;width:100%}
[data-l=es] .en,[data-l=en] .es{display:none}
</style>
</head>
<body>
<div class="deck" role="toolbar" aria-label="Controles del prototipo">
  <span class="ttl">Elevation · diseño final propuesto</span>
  <label class="sr" for="scr">Pantalla</label><select id="scr"></select>
  <button id="bDev" type="button" aria-pressed="false">Móvil</button>
  <button id="bLang" type="button" aria-pressed="false">EN</button>
  <button id="bTheme" type="button" aria-pressed="false">Oscuro</button>
</div>
<div class="ribbon" id="ribbon"></div>
<div class="stage"><div class="device" id="device"><div id="view" data-l="es"></div></div></div>
<script src="copy.js"></script>
<script>
const COPY={es:{},en:{}};(window.COPY_ROWS||[]).forEach(r=>{if(r.length>1){COPY.es[r[0]]=r[1];COPY.en[r[0]]=r[2]}});
let L=(localStorage.getItem('elv_proto_lang')||'es'),DEV=false,STATE={ob:1,mood:null,modal:null,tog:{}};
const $=s=>document.querySelector(s);
const t=(k,v={})=>{let s=COPY[L][k];if(s===undefined)return '⟦'+k+'⟧';for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const CAPS={es:['Adaptabilidad','Análisis de información','Aprendizaje autónomo','Comunicación','Influencia y liderazgo','Planificación y organización','Resolución de problemas','Trabajo en equipo'],en:['Adaptability','Information analysis','Self-directed learning','Communication','Influence and leadership','Planning and organisation','Problem solving','Teamwork']};
const SHORT={es:['Adaptabilidad','Análisis','Aprendizaje','Comunicación','Influencia','Planificación','Problemas','Equipo'],en:['Adaptability','Analysis','Learning','Communication','Influence','Planning','Problems','Teamwork']};
const D={es:{date:'30 de noviembre',pct:'4'},en:{date:'30 November',pct:'4'}};
const ic={home:'⌂',chat:'✎',map:'◎',ev:'☰',more:'⋯'};

/* ---------- shells ---------- */
const langSw=()=>`<div class="lang" role="group" aria-label="${t('lang.label')}"><button type="button" data-lang="es" aria-pressed="${L==='es'}">ES</button><button type="button" data-lang="en" aria-pressed="${L==='en'}">EN</button></div>`;
const pub=(inner)=>`<div class="pub"><a class="sr" href="#main">${t('skip')}</a><header class="pubbar"><a class="brand" href="#land">${t('brand')}<i></i></a><div style="display:flex;gap:.6rem;align-items:center">${langSw()}<a class="btn" href="#login">${t('land.nav.login')}</a></div></header><main id="main">${inner}</main></div>`;
const NAVP=[['home','nav.home'],['chat','nav.chat'],['map','nav.map'],['evidence','nav.evidence']];
const MORE=[['diary','nav.diary'],['next','nav.next'],['bridge','nav.bridge'],['pro','nav.pro'],['data','nav.data']];
function appP(cur,inner){
  const g=id=>({home:'home',chat:'chat','chat-pending':'chat','chat-limit':'chat',map:'map','map-evidence':'map',evidence:'evidence','evidence-new':'evidence',diary:'diary','diary-new':'diary',next:'next',bridge:'bridge',pro:'pro',data:'data','data-delete':'data'})[id]||id;
  const c=g(cur);
  const nv=(id,k,i)=>`<a class="nv" href="#${id}" ${c===id?'aria-current="page"':''}><span aria-hidden="true">${i||''}</span>${t(k)}</a>`;
  const mb=(id,k,i)=>`<a href="#${id}" ${c===id?'aria-current="page"':''}><span class="ic" aria-hidden="true">${i}</span>${t(k)}</a>`;
  return `<div class="app"><a class="sr" href="#main">${t('skip')}</a>
  <aside class="rail" aria-label="${t('nav.more')}"><a class="brand" href="#home">${t('brand')}<i></i></a>
   <nav aria-label="Principal">${NAVP.map((n,i)=>nv(n[0],n[1],Object.values(ic)[i])).join('')}<div class="sep"></div>${MORE.map(n=>nv(n[0],n[1],'·')).join('')}</nav>
   <div class="foot">${langSw()}<a class="btn q" href="#login" style="justify-content:flex-start">${t('nav.logout')}</a></div></aside>
  <div class="mtop"><a class="brand" href="#home">${t('brand')}<i></i></a>${langSw()}</div>
  <main class="main" id="main" tabindex="-1">${inner}</main>
  <nav class="mbar" aria-label="Principal">${NAVP.map((n,i)=>mb(n[0],n[1],Object.values(ic)[i])).join('')}${mb('more','nav.more',ic.more)}</nav></div>`;
}
function appR(role,items,cur,inner){
  const nv=(id,label,i)=>`<a class="nv" href="#${id}" ${cur===id?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${label}</a>`;
  return `<div class="app"><a class="sr" href="#main">${t('skip')}</a><aside class="rail"><a class="brand" href="#${cur}">${t('brand')}<i></i></a><span class="rolechip">${role}</span><nav>${items.map(x=>nv(x[0],x[1],x[2])).join('')}</nav><div class="foot">${langSw()}<a class="btn q" href="#login" style="justify-content:flex-start">${t('nav.logout')}</a></div></aside>
  <div class="mtop"><a class="brand" href="#${cur}">${t('brand')}<i></i></a>${langSw()}</div>
  <main class="main" id="main" tabindex="-1">${inner}</main>
  <nav class="mbar" style="grid-template-columns:repeat(${Math.min(items.length,4)},1fr)" aria-label="Principal">${items.slice(0,4).map(x=>`<a href="#${x[0]}" ${cur===x[0]?'aria-current="page"':''}><span class="ic" aria-hidden="true">${x[2]}</span>${x[1]}</a>`).join('')}</nav></div>`;
}
const privacy=()=>`<span class="priv">🔒 ${t('badge.private')}</span>`;
const notice=()=>`<div class="alert info" role="note"><div>${t('notice.nonclinical')}</div></div>`;

/* ---------- pantallas ---------- */
const S={};
S.land=()=>pub(`<section class="hero"><span class="eyebrow">${t('land.hero.label')}</span><h1>${t('land.hero.title').replace(/(\S+)$/,'<u>$1</u>')}</h1><p class="lead">${t('land.hero.sub')}</p>
<div class="doors"><a class="door" href="#login"><span class="eyebrow">01 · ${t('land.door1.label')}</span><h2>${t('land.door1.title')}</h2><p class="sub">${t('land.door1.desc')}</p><span class="go">${t('land.door.go')} →</span></a>
<a class="door" href="#login"><span class="eyebrow">02 · ${t('land.door2.label')}</span><h2>${t('land.door2.title')}</h2><p class="sub">${t('land.door2.desc')}</p><span class="go">${t('land.door.go')} →</span></a></div></section>
<section class="sec" id="how"><h2>${t('land.how.title')}</h2><div class="steps">${[1,2,3].map(n=>`<div class="card"><b>${n}</b><p>${t('land.how.'+n)}</p></div>`).join('')}</div></section>
<section class="sec"><div class="grid2"><div class="card"><h2>🔒 ${t('land.priv.title')}</h2><p class="sub">${t('land.priv.body')}</p></div><div class="card"><h2>${t('land.limits.title')}</h2><p class="sub">${t('land.limits.body')}</p></div></div></section>
<section class="sec" style="align-items:flex-start"><a class="btn p" href="#login">${t('land.cta')}</a><p class="sub">${t('land.cta.sub')} ${t('land.pilot')}</p><a href="#login">${t('land.pros')}</a></section>`);
S.login=(err)=>pub(`<div class="authwrap"><form class="card" onsubmit="return false" novalidate><h1>${t('login.title')}</h1><p class="sub">${t('login.sub')}</p>
${err?`<div class="alert err" role="alert"><div>${t('login.err.credentials')}</div></div>`:''}
<div class="field"><label for="e">${t('login.email')}</label><input id="e" type="email" autocomplete="username"></div>
<div class="field"><label for="p">${t('login.password')}</label><div style="position:relative"><input id="p" type="password" autocomplete="current-password" style="padding-right:5.5rem"><button type="button" class="btn q" style="position:absolute;right:.2rem;top:.15rem" aria-pressed="false">${t('login.show')}</button></div></div>
<a href="#login">${t('login.forgot')}</a>
<button class="btn p block" type="submit">${t('login.submit')}</button>
<div style="text-align:center"><span class="sub">${t('login.new')}</span> <a href="#onboarding">${t('login.create')}</a></div></form></div>`);
S['login-error']=()=>S.login(true);
S.onboarding=()=>{const n=STATE.ob;const steps=[()=>`<h1>${t('ob.s1.title')}</h1><p class="sub">${t('ob.s1.sub')}</p><div class="field"><label for="l">${t('ob.s1.lang')}</label><select id="l"><option>${L==='es'?'Español':'Spanish'}</option><option>${L==='es'?'Inglés':'English'}</option></select></div><div class="field"><label for="z">${t('ob.s1.tz')}</label><select id="z"><option>${L==='es'?'Elige tu zona':'Choose your zone'}</option></select></div><button class="btn q" type="button" style="align-self:flex-start">${t('ob.s1.tz.use')}</button>`,
()=>`<h1>${t('ob.s2.title')}</h1><p class="sub">${t('ob.s2.sub')}</p>${[1,2].map(i=>`<label class="card" style="flex-direction:row;gap:.8rem;cursor:pointer"><input type="radio" name="o" style="width:22px;height:22px;margin-top:.15rem"><span><b>${t('ob.s2.o'+i)}</b><br><span class="sub">${t('ob.s2.o'+i+'d')}</span></span></label>`).join('')}`,
()=>`<h1>${t('ob.s3.title')}</h1><p class="sub">${t('ob.s3.sub')}</p><div class="empty"><span aria-hidden="true" style="font-size:1.6rem">⬆</span><b>${t('ob.s3.drop')}</b><button class="btn p" type="button">${t('ob.s3.pick')}</button><p>${t('ob.s3.rules')}</p></div><p class="sub">🔒 ${t('ob.s3.note')}</p><button class="btn q" type="button" style="align-self:flex-start">${t('ob.s3.manual')}</button>`];

function radar(filled){const cx=200,cy=160,R=88;const n=8;let g='';for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--control)" stroke-dasharray="3 3"/>`;const lx=cx+(R+26)*Math.cos(a),ly=cy+(R+26)*Math.sin(a);g+=`<text x="${lx}" y="${ly}" font-size="11" text-anchor="${Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end')}" fill="var(--ink-2)">${SHORT[L][i]}</text>`}
 g+=[.25,.5,.75,1].map(k=>`<circle cx="${cx}" cy="${cy}" r="${R*k}" fill="none" stroke="var(--line)"/>`).join('');
 if(filled){const w=Math.PI/8,m=-Math.PI/2+3*2*Math.PI/n,r=R*.5,p=(ang)=>(cx+r*Math.cos(ang)).toFixed(1)+" "+(cy+r*Math.sin(ang)).toFixed(1);g+=`<path d="M${cx} ${cy} L${p(m-w)} A${r} ${r} 0 0 1 ${p(m+w)} Z" fill="var(--ocre)" opacity=".55"/>`}
 return `<svg class="radar" viewBox="0 0 400 320" role="img" aria-label="${t('map.title')}">${g}</svg>`}

function render(){

}

  const g=e.target.closest('[data-tog]');if(g){STATE.tog[g.dataset.tog]=!STATE.tog[g.dataset.tog];render();return}
});
