<style>
/* Maqueta de DISEÑO ES-360 (no es código de producto): textos finales ES/EN de portada, demostración, registro y acceso, con lista de elementos a retirar y mapa de claves i18n.
   Tokens y piezas = Cartografía (mismas que las láminas aprobadas). Los textos son PROPUESTA de UX/UI-Claude a partir de la propuesta de Alejo; lo marcado «No verificado» depende de producto o tecnología.
   Sin tipografías autoalojadas (alternativa del sistema). Datos de ejemplo (@example.test). */
.cg{--cg-ground:#e7ece8;--cg-panel:#f2f5f2;--cg-ink:#14201c;--cg-muted:#475550;--cg-line:#b9c3bd;--cg-mark:#1d4f91;--cg-err:#a8321d;--cg-good:#1f5f46;
--cg-font-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--cg-font-sans:'Barlow',system-ui,sans-serif;--cg-font-name:'Spectral',Georgia,serif;
--cg-touch:2.875rem;--cg-focus:3px;color-scheme:light;background:var(--cg-ground);color:var(--cg-ink);font:400 1.0625rem/1.55 var(--cg-font-sans)}
@media (prefers-color-scheme:dark){.cg:not([data-theme='light']){--cg-ground:#0e1613;--cg-panel:#15201c;--cg-ink:#e9efeb;--cg-muted:#9daaa4;--cg-line:#2a3832;--cg-mark:#7fb0e8;--cg-err:#ff8a70;--cg-good:#7dd3a8;color-scheme:dark}}
.cg[data-theme='dark']{--cg-ground:#0e1613;--cg-panel:#15201c;--cg-ink:#e9efeb;--cg-muted:#9daaa4;--cg-line:#2a3832;--cg-mark:#7fb0e8;--cg-err:#ff8a70;--cg-good:#7dd3a8;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}body{margin:0}
.cg :focus-visible{outline:var(--cg-focus) solid var(--cg-mark);outline-offset:3px}
.cg a{color:var(--cg-mark);text-underline-offset:3px}
.cg-muted{color:var(--cg-muted)}
.cg-tag{font:600 .78rem var(--cg-font-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--cg-muted)}
.cg-btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--cg-touch);min-width:var(--cg-touch);padding:.55rem 1.2rem;background:var(--cg-ink);color:var(--cg-ground);border:0;border-radius:0;font:700 1rem var(--cg-font-cond);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.cg-btn:hover{background:var(--cg-mark)}
.cg a.cg-btn{color:var(--cg-ground)}
.cg-btn--ghost,.cg a.cg-btn--ghost{background:none;color:var(--cg-ink);box-shadow:inset 0 0 0 1.5px var(--cg-ink)}
.cg-btn--ghost:hover{background:none;color:var(--cg-mark);box-shadow:inset 0 0 0 1.5px var(--cg-mark)}
.cg-btn--danger{background:var(--cg-err);color:var(--cg-ground)}.cg-btn--danger:hover{background:var(--cg-err)}
.cg-btn:disabled{opacity:.55;cursor:not-allowed;background:var(--cg-ink);color:var(--cg-ground)}
.cg-btn--ghost:disabled{background:none;color:var(--cg-ink)}
.cg-linkbtn{min-width:var(--cg-touch);background:none;border:0;border-bottom:1.5px solid var(--cg-mark);border-radius:0;padding:.1rem 0;min-height:var(--cg-touch);font:600 1rem var(--cg-font-sans);color:var(--cg-ink);cursor:pointer}
.cg-card{background:var(--cg-panel);border:1.5px solid var(--cg-ink);padding:1rem 1.1rem}
.cg-banner{border:1.5px solid var(--cg-ink);padding:.8rem 1rem;background:var(--cg-panel);margin:1rem 0}
.cg-banner--error{border-color:var(--cg-err)}
.cg-banner__title{display:block;font-weight:600}
.cg-banner--error .cg-banner__title::before{content:'\26A0\00a0';color:var(--cg-err)}
.cg-chip{display:inline-flex;gap:.3rem;align-items:center;border:1px solid var(--cg-line);padding:.05rem .45rem;font:600 .78rem var(--cg-font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--cg-muted)}
.cg-chip--ok{border-color:var(--cg-good);color:var(--cg-good)}.cg-chip--wait{border-color:var(--cg-mark);color:var(--cg-mark)}.cg-chip--bad{border-color:var(--cg-err);color:var(--cg-err)}
.cg-field{display:grid;gap:.3rem;margin-top:1rem;border:0;padding:0;min-width:0}
.cg-label{font:600 .85rem var(--cg-font-cond);letter-spacing:.1em;text-transform:uppercase;padding:0}
.cg-input,.cg-textarea{width:100%;min-height:var(--cg-touch);padding:.7rem .8rem;background:var(--cg-panel);color:var(--cg-ink);border:1.5px solid var(--cg-ink);border-radius:0;font:inherit}
.cg-textarea{min-height:9rem;resize:vertical;line-height:1.5}
.cg-input[aria-invalid='true'],.cg-textarea[aria-invalid='true']{border-color:var(--cg-err);border-width:2px}
.cg-hint{color:var(--cg-muted);font-size:.85rem;margin:0}
.cg-error{color:var(--cg-err);font-size:.9rem;margin:0}.cg-error::before{content:'\26A0\00a0'}
.cg-items{list-style:none;margin:0;padding:0}
.cg-item{border-top:1px solid var(--cg-line);padding:.9rem 0;display:grid;gap:.4rem}.cg-item:first-child{border-top:2px solid var(--cg-ink)}
.cg-dialog{background:var(--cg-panel);color:var(--cg-ink);border:2px solid var(--cg-ink);padding:1.3rem 1.4rem;max-width:min(30rem,calc(100vw - 2rem));width:100%}
.cg-dialog__actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1.2rem}
.cg-scrim{background:rgb(14 22 19/.55);padding:1.2rem 0;display:flex;justify-content:center}
/* marco (shell.css + ES-153 aprobado) */
.cg-frame{min-height:100dvh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cg-skip{position:absolute;left:1rem;top:-10rem;z-index:100;background:var(--cg-panel);color:var(--cg-mark);border:2px solid var(--cg-ink);padding:.7rem 1rem;font-weight:600}.cg-skip:focus{top:1rem}
.cg-header{display:flex;align-items:center;justify-content:space-between;gap:.8rem 1.4rem;flex-wrap:wrap;padding:1rem 0;border-bottom:1px solid var(--cg-line);max-width:1240px;width:100%;margin:0 auto}
.cg a.cg-brand{font:700 1.7rem var(--cg-font-cond);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--cg-ink);display:inline-flex;align-items:center;min-height:var(--cg-touch)}
.cg-brand i{font-style:normal;color:var(--cg-mark)}
.cg-nav{display:flex;gap:.2rem 1.3rem;flex-wrap:wrap;align-items:center;font:600 .95rem var(--cg-font-cond);letter-spacing:.08em;text-transform:uppercase}
.cg-nav a{color:var(--cg-ink);text-decoration:none;border-bottom:3px solid transparent;display:inline-flex;align-items:center;justify-content:center;min-height:var(--cg-touch);min-width:var(--cg-touch)}
.cg-nav a:hover{border-color:var(--cg-mark)}.cg-nav a[aria-current='page']{border-color:var(--cg-ink)}
.cg-header__end{display:flex;align-items:center;gap:.7rem 1rem;flex-wrap:wrap;margin-left:auto}
.cg-lang,.cg-seg{display:inline-flex;border:1.5px solid var(--cg-ink)}
.cg-lang__btn,.cg-seg button{min-width:var(--cg-touch);min-height:var(--cg-touch);padding:0 .8rem;background:none;border:0;border-radius:0;color:var(--cg-ink);font:700 .95rem var(--cg-font-cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.cg-lang__btn[aria-pressed='true'],.cg-seg button[aria-pressed='true']{background:var(--cg-ink);color:var(--cg-ground)}
.cg-seg button+button{border-left:1.5px solid var(--cg-ink)}
.cg-usermenu__button{background:none;border:0;border-bottom:3px solid transparent;min-height:var(--cg-touch);padding:0 .2rem;color:var(--cg-ink);font:italic 500 1.1rem var(--cg-font-name)}
.cg-usermenu__button.is-here{border-color:var(--cg-ink)}
.cg-body{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:1rem 0 2rem;min-width:0}
.cg-main{min-width:0;outline:none}
.cg-prefs{display:flex;gap:.6rem 1.4rem;flex-wrap:wrap;align-items:center;width:100%;max-width:1240px;margin:0 auto;padding:.8rem 0;border-top:1px solid var(--cg-line);font-size:.85rem;color:var(--cg-muted)}
.cg-prefs__group{display:inline-flex;align-items:center;gap:.6rem}
.cg-footer{display:flex;justify-content:space-between;gap:.4rem 1rem;flex-wrap:wrap;padding:1.2rem 0 2rem;border-top:1px solid var(--cg-line);font-size:.85rem;color:var(--cg-muted);max-width:1240px;width:100%;margin:0 auto}
.cg-only-narrow{display:none}
@media (max-width:900px){
 .cg-body{padding-top:.6rem}
 .cg-header--person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .8rem;padding:.4rem 0 .6rem}
 .cg-header--person .cg-header__end{display:contents}

    '<div class="ld-sub"><h3>' + x('landing.soon.title') + '</h3><p class="cg-hint">' + x('landing.soon.intro') + '</p><div class="ld-grid3" style="margin-top:.8rem">' + nv('landing.skillmap.routes.body', soonc('routes')) + soonc('experiment') + soonc('ai') + '</div></div></section>'
}
function langs() {
  return '<section class="ld-sec" aria-labelledby="lg"><h2 class="ld-h2" id="lg">' + x('landing.langs.title') + '</h2>' + nv('landing.langs.body', '<p class="ld-lead" style="margin:0">' + x('landing.langs.body') + '</p>') + '</section>'
}
function nextBlock(v) {
  if (v === 'b') return nv('landing.next.pilot.title', card('<h2 class="ld-h2">' + x('landing.next.pilot.title') + '</h2><p>' + x('landing.next.pilot.body') + '</p><div class="pg-actions">' + lk(x('landing.next.login'), 'cg-btn cg-btn--ghost') + '</div>'))
  return nv('landing.next.body', card('<h2 class="ld-h2">' + x('landing.next.title') + '</h2><p>' + x('landing.next.body') + '</p><div class="pg-actions">' + lk(x('landing.header.create'), 'cg-btn') + lk(x('landing.next.login'), 'cg-btn cg-btn--ghost') + '</div>'))
}
function pros() {
  return '<section class="ld-sec" id="pros" aria-labelledby="pr"><h2 class="ld-h2" id="pr">' + x('landing.pros.title') + '</h2>' + nv('landing.pros.intro', '<p class="ld-lead">' + x('landing.pros.intro') + '</p>') +
    '<div class="pg-actions">' + lk(x('landing.pros.cta'), 'cg-btn cg-btn--ghost') + '</div><p class="cg-hint" style="margin-top:.6rem">' + x('landing.pros.cta_note') + '</p></section>'
}
const closing = () => '<section class="ld-sec" aria-label="' + L('Aviso', 'Notice') + '"><p class="ld-notice" style="margin:0">' + x('landing.footer.notice') + '</p></section>'
function landing() { return hero() + demo('idle') + how() + what() + skillmap() + langs() + '<section class="ld-sec" id="next">' + nextBlock('a') + '</section>' + pros() + closing() }

// ---- Acceso
const AC = {
  name: L('Nombre', 'Name'), email: L('Correo electrónico', 'Email address'), pass: L('Contraseña', 'Password'),
  show: L('Mostrar', 'Show'), errName: L('Escribe tu nombre.', 'Enter your name.'), errEmail: L('Escribe un correo válido, por ejemplo nombre@ejemplo.com.', 'Enter a valid email, for example name@example.com.'),
  errTerms: L('Para crear tu cuenta necesitas aceptar el aviso de privacidad y los términos.', 'To create your account you need to accept the privacy notice and the terms.'),
  haveAcc: L('¿Ya tienes cuenta?', 'Already have an account?'), noAcc: L('¿Aún no tienes cuenta?', 'Do not have an account yet?'),
  forgot: L('¿Olvidaste tu contraseña?', 'Forgot your password?'), reqTitle: L('Tu contraseña debe tener:', 'Your password must have:'),
  rules: [[L('Al menos 8 caracteres', 'At least 8 characters')], [L('Una mayúscula (A-Z)', 'One uppercase letter (A-Z)')], [L('Una minúscula (a-z)', 'One lowercase letter (a-z)')], [L('Un número (0-9)', 'One number (0-9)')], [L('Un carácter especial (! ? # $ % & * …); el espacio no cuenta', 'One special character (! ? # $ % & * …); a space does not count')]]
}
function fld(id, label, type, val, err, extra) {
  return '<div class="cg-field"><label class="cg-label" for="' + id + '">' + label + '</label><input class="cg-input" id="' + id + '" type="' + type + '" value="' + (val || '') + '"' + (err ? ' aria-invalid="true" aria-describedby="' + id + '-e"' : '') + (extra || '') + '>' + (err ? '<p class="cg-error" id="' + id + '-e" role="alert">' + err + '</p>' : '') + '</div>'
}
function pwField(val, ok, tooLong) {
  const rules = '<ul class="ld-pw" id="pw-req"><li class="vh" style="list-style:none"></li>' + AC.rules.map((r, i) => '<li' + (ok[i] ? ' class="ok"' : '') + '>' + r[0] + ' <span class="vh">(' + (ok[i] ? L('cumplido', 'met') : L('pendiente', 'pending')) + ')</span></li>').join('') + '</ul>'
  const miss = ok.map((o, i) => o ? null : [L('al menos 8 caracteres', 'at least 8 characters'), L('una mayúscula', 'an uppercase letter'), L('una minúscula', 'a lowercase letter'), L('un número', 'a number'), L('un carácter especial', 'a special character')][i]).filter(Boolean)
  const msg = tooLong ? x('landing.access.pw.too_long') : (miss.length ? L('Tu contraseña necesita: ', 'Your password needs: ') + miss.join(', ') + '.' : '')
  return '<div class="cg-field"><label class="cg-label" for="pw">' + AC.pass + '</label><div style="display:flex;gap:.5rem"><input class="cg-input" id="pw" type="password" value="' + val + '" aria-describedby="pw-hint pw-req' + (msg ? ' pw-e' : '') + '"' + (msg ? ' aria-invalid="true"' : '') + ' autocomplete="new-password" style="flex:1;min-width:0">' + btn(AC.show, 'cg-btn--ghost') + '</div>' +
    '<p class="cg-hint" id="pw-hint">' + x('landing.access.password_policy') + '</p><p class="cg-hint">' + AC.reqTitle + '</p>' + rules + (msg ? '<p class="cg-error" id="pw-e" role="alert">' + msg + '</p>' : '') + '</div>'
}
function terms(err) {
  return '<div class="ld-chk"><input type="checkbox" id="terms"' + (err ? ' aria-invalid="true" aria-describedby="terms-e"' : '') + '><label for="terms">' + L('He leído y acepto el ', 'I have read and accept the ') + lk(L('aviso de privacidad', 'privacy notice')) + L(' y los ', ' and the ') + lk(L('términos de uso', 'terms of use')) + '.</label></div>' + (err ? '<p class="cg-error" id="terms-e" role="alert">' + AC.errTerms + '</p>' : '')
}
function authCard(title, intro, inner) { return '<section class="ld-auth cg-card" aria-labelledby="at"><h1 id="at">' + title + '</h1>' + (intro ? '<p class="cg-hint" style="font-size:1rem;margin-bottom:.6rem">' + intro + '</p>' : '') + inner + '</section>' }
function register(kind) {
  const err = kind === 'err', pw = kind === 'pw', long = kind === 'long'
  const name = fld('nm', AC.name, 'text', err ? '' : 'Ana Ejemplo', err ? AC.errName : '', ' autocomplete="name"')
  const email = fld('em', AC.email, 'email', err ? 'ana@ejemplo' : 'ana@example.test', err ? AC.errEmail : '', ' autocomplete="email"')
  const pass = long ? pwField('••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••ñññ', [1, 1, 1, 1, 1].map(Boolean), true) : pwField(err ? '' : pw ? 'Abc123' : '', pw ? [0, 1, 1, 1, 0].map(Boolean) : [0, 0, 0, 0, 0].map(Boolean), false)
  const inner = name + email + (err ? pwField('', [0, 0, 0, 0, 0].map(Boolean), false).replace(/<p class="cg-error" id="pw-e"[^>]*>[^<]*<\/p>/, '') : pass) + terms(err) +
    nv('access.no_payment', '<p class="cg-hint" style="margin-top:1rem">' + x('access.no_payment') + '</p>') +
    '<div class="pg-actions">' + btn(x('landing.access.register')) + '</div>' +
    nv('access.privacy_note', '<p class="cg-hint" style="margin-top:1rem">' + x('access.privacy_note') + ' ' + lk(x('access.privacy_link')) + '.</p>') +
    '<p style="margin-top:1rem">' + AC.haveAcc + ' <button type="button" class="cg-linkbtn">' + x('access.sign_in') + '</button></p>'
  return authCard(x('landing.access.register'), '', inner)
}
function login() {
  const inner = fld('em', AC.email, 'email', 'ana@example.test', '', ' autocomplete="email"') + '<div class="cg-field"><label class="cg-label" for="pw">' + AC.pass + '</label><div style="display:flex;gap:.5rem"><input class="cg-input" id="pw" type="password" autocomplete="current-password" style="flex:1;min-width:0">' + btn(AC.show, 'cg-btn--ghost') + '</div></div>' +
    '<div class="pg-actions">' + btn(x('btn_login')) + '</div><p style="margin-top:1rem">' + lk(AC.forgot) + '</p><p>' + AC.noAcc + ' <button type="button" class="cg-linkbtn">' + x('landing.access.register') + '</button></p>'
  return authCard(x('access.sign_in'), nv('login_subtitle', x('login_subtitle')), inner)
}
function forgot(sent) {
  const intro = L('Escribe el correo de tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.', 'Enter your account email and we will send you a link to choose a new password.')
  const inner = fld('em', AC.email, 'email', 'ana@example.test', '', ' autocomplete="email"') + (sent ? '<p role="status" class="cg-banner">' + L('Si existe una cuenta con ese correo, te enviaremos un enlace. Caduca en 30 minutos.', 'If an account exists for that email, we will send you a link. It expires in 30 minutes.') + '</p>' : '') +
    '<div class="pg-actions">' + btn(x('landing.access.reset.send'), '', sent ? 'disabled' : '') + '</div><p style="margin-top:1rem">' + lk(L('Volver a iniciar sesión', 'Back to sign in')) + '</p>'
  return authCard(L('Recuperar contraseña', 'Reset your password'), intro, inner)
}

// ---- Documentos de revisión
function dochead(tag, title, lead) { return '<div class="pg-head" style="max-width:52rem"><p class="cg-tag" lang="es">' + tag + '</p><h1 class="pg-title" lang="es">' + title + '</h1><p class="pg-lead" lang="es">' + lead + '</p></div>' }
function retire() {
  return '<div class="dc">' + dochead('ES-360 · Qué se retira', 'Lista de elementos a retirar', 'Todo lo de esta tabla sale de la portada y del acceso para quien usa el servicio. «Evidencia» indica de dónde sale cada dato; lo que no pude comprobar en ejecución está dicho.') +
    '<table class="kt" lang="es"><caption>' + RET.length + ' elementos</caption><thead><tr><th scope="col">Elemento</th><th scope="col">Dónde</th><th scope="col">Motivo</th><th scope="col">Evidencia</th></tr></thead><tbody>' +
    RET.map(r => '<tr><th scope="row">' + r[0] + '</th><td data-l="Dónde">' + r[1] + '</td><td data-l="Motivo">' + r[2] + '</td><td data-l="Evidencia">' + r[3] + '</td></tr>').join('') + '</tbody></table></div>'
}
function claims() {
  return '<div class="dc">' + dochead('ES-360 · Cuadre con el aviso y los términos', 'Afirmaciones del producto que deben cuadrar', 'No se reescribe el aviso de privacidad ni los términos: van al abogado. Esta lista dice qué afirmaciones de la portada y del registro dependen de ellos, qué hay que confirmar y quién lo confirma.') +
    '<table class="kt" lang="es"><caption>' + CLAIMS.length + ' afirmaciones</caption><thead><tr><th scope="col">Afirmación</th><th scope="col">Dónde aparece</th><th scope="col">Qué hay que confirmar</th><th scope="col">Quién</th></tr></thead><tbody>' +
    CLAIMS.map(r => '<tr><th scope="row">' + r[0] + '</th><td data-l="Dónde">' + r[1] + '</td><td data-l="Confirmar">' + r[2] + '</td><td data-l="Quién">' + r[3] + '</td></tr>').join('') + '</tbody></table></div>'
}
function keys() {
  const rows = K.map(r => {
    const s = ST[r[1]]
    return '<tr><th scope="row"><code>' + r[0] + '</code></th><td data-l="Estado">' + chip(s[0], s[1]) + '</td><td data-l="ES" lang="es">' + (r[1] === 'r' ? '—' : r[2]) + '</td><td data-l="EN" lang="en">' + (r[1] === 'r' ? '—' : r[3]) + '</td><td data-l="Verificación" lang="es">' + (r[4] ? '<strong>No verificado.</strong> ' + r[4] : (r[1] === 'e' ? 'Texto vigente' : '—')) + '</td></tr>'
  }).join('')
  const cnt = c => K.filter(r => r[1] === c).length
  return '<div class="dc">' + dochead('ES-360 · Mapa i18n', 'Clave → ES → EN', 'Claves de shared/landing-content.json, del catálogo i18n y de accessCopy.ts / dataCopy.ts. Nuevas: ' + cnt('n') + ' · Cambian: ' + cnt('c') + ' · Iguales (se listan por contexto): ' + cnt('e') + ' · Se retiran: ' + cnt('r') + ' filas (agrupan más claves en la lista «Qué se retira»). El inglés se adapta por sentido, no palabra por palabra.') +
    '<table class="kt"><caption lang="es">' + K.length + ' filas</caption><thead><tr><th scope="col" lang="es">Clave</th><th scope="col" lang="es">Estado</th><th scope="col">ES</th><th scope="col">EN</th><th scope="col" lang="es">Verificación</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
}

function body() {
  switch (scene) {
    case 'landing': return frame(landing(), true)
    case 'demo-idle': return frame(demo('idle'), true)
    case 'demo-hint': return frame(demo('hint'), true)
    case 'demo-yes': return frame(demo('yes'), true)
    case 'demo-rise': return frame(demo('rise'), true)
    case 'demo-no': return frame(demo('no'), true)
    case 'next-b': return frame('<section class="ld-sec"><p class="cg-tag" lang="es">Variante A · registro abierto</p>' + nextBlock('a') + '</section><section class="ld-sec"><p class="cg-tag" lang="es">Variante B · acceso por invitación (decide el PO)</p>' + nextBlock('b') + '</section>', true)
    case 'register': return frame(register(''), false)
    case 'register-err': return frame(register('err'), false)
    case 'register-pw': return frame(register('pw'), false)
    case 'register-pw-long': return frame(register('long'), false)
    case 'login': return frame(login(), false)
    case 'forgot': return frame(forgot(false), false)
    case 'forgot-sent': return frame(forgot(true), false)
    case 'retire': return frame(retire(), false)
    case 'claims': return frame(claims(), false)
    case 'keys': return frame(keys(), false)
  }
  return frame(landing(), true)
}
function render() {
  document.documentElement.lang = lang
  const root = document.getElementById('root')
  root.innerHTML = '<div class="cg"' + (theme !== 'system' ? ' data-theme="' + theme + '"' : '') + '>' + body() + '</div>'
  history.replaceState(null, '', '#scene=' + scene + '&lang=' + lang + '&theme=' + theme + (marks ? '' : '&marks=0'))
}
function init() {
  const sel = document.getElementById('scene'); sel.innerHTML = SCENES.map(s => '<option value="' + s[0] + '">' + s[1] + '</option>').join(''); sel.value = scene
  document.getElementById('lang').value = lang; document.getElementById('theme').value = theme; document.getElementById('marks').checked = marks
  sel.onchange = e => { scene = e.target.value; render() }
  document.getElementById('lang').onchange = e => { lang = e.target.value; render() }
  document.getElementById('theme').onchange = e => { theme = e.target.value; render() }
  document.getElementById('marks').onchange = e => { marks = e.target.checked; render() }
  window.addEventListener('hashchange', () => { const q = new URLSearchParams(location.hash.slice(1)); scene = q.get('scene') || scene; lang = q.get('lang') || lang; theme = q.get('theme') || theme; marks = q.get('marks') !== '0'; sel.value = scene; document.getElementById('lang').value = lang; document.getElementById('theme').value = theme; document.getElementById('marks').checked = marks; render() })
  render()
}
init()

</script>
