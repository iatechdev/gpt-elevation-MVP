:root{
 --cg-ground:#e7ece8;--cg-panel:#f2f5f2;--cg-ink:#14201c;--cg-muted:#475550;--cg-line:#b9c3bd;--cg-contour:#8f5a33;--cg-mark:#1d4f91;--cg-err:#a8321d;--cg-good:#1f5f46;
 --cg-raise:#ffffff;--cg-mark-soft:#dbe6f4;--cg-warm-soft:#efe3d6;--cg-good-soft:#d9eadf;--cg-err-soft:#f6ddd6; /* nuevo: superficies suaves */
 --cg-font-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--cg-font-sans:'Barlow',system-ui,sans-serif;
 --cg-touch:2.875rem;--cg-wrap:1240px;--cg-gutter:clamp(1rem,2.5vw,2rem);--cg-w-read:44rem;--cg-w-form:40rem;--cg-w-card:30rem;--cg-w-room:48rem;
 --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s6:1.5rem;--s8:2rem;--s12:3rem;--s16:4rem;--r:0;--shadow:6px 6px 0 rgb(0 0 0/.10)
}
:root[data-theme=dark]{--cg-ground:#0e1613;--cg-panel:#15201c;--cg-ink:#e9efeb;--cg-muted:#9daaa4;--cg-line:#2a3832;--cg-contour:#c9976a;--cg-mark:#7fb0e8;--cg-err:#ff8a70;--cg-good:#7dd3a8;--cg-raise:#1a2722;--cg-mark-soft:#1d2e45;--cg-warm-soft:#2b2219;--cg-good-soft:#1a2e25;--cg-err-soft:#3a201a;--shadow:6px 6px 0 rgb(0 0 0/.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cg-ground:#0e1613;--cg-panel:#15201c;--cg-ink:#e9efeb;--cg-muted:#9daaa4;--cg-line:#2a3832;--cg-contour:#c9976a;--cg-mark:#7fb0e8;--cg-err:#ff8a70;--cg-good:#7dd3a8;--cg-raise:#1a2722;--cg-mark-soft:#1d2e45;--cg-warm-soft:#2b2219;--cg-good-soft:#1a2e25;--cg-err-soft:#3a201a;--shadow:6px 6px 0 rgb(0 0 0/.35)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cg-ground);color:var(--cg-ink);font:400 1.0625rem/1.55 var(--cg-font-sans);overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--cg-font-cond);text-transform:uppercase;line-height:1.02;margin:0 0 var(--s2);letter-spacing:.01em}
h1{font-size:clamp(2.1rem,5vw,3.2rem)}h2{font-size:1.55rem}h3{font-size:1.2rem}h4{font-size:1rem;letter-spacing:.08em;color:var(--cg-muted)}
p{margin:var(--s2) 0;max-width:46rem}a{color:var(--cg-mark);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--cg-mark);outline-offset:3px}
.skip{position:absolute;left:1rem;top:-10rem;z-index:100;background:var(--cg-panel);border:2px solid var(--cg-ink);padding:.7rem 1rem}.skip:focus{top:1rem}
.wrap{width:min(100% - 2*var(--cg-gutter),var(--cg-wrap));margin-inline:auto}
.muted{color:var(--cg-muted)}.tag{font:600 .8125rem var(--cg-font-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--cg-muted);margin:0 0 var(--s2)}
/* barra de prototipo (no es producto) */
.proto{background:var(--cg-ink);color:var(--cg-ground);font-size:.875rem}
.proto .wrap{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;padding:var(--s2) 0}
.proto strong{font:700 .95rem var(--cg-font-cond);letter-spacing:.1em;text-transform:uppercase}
.seg{display:inline-flex;border:1.5px solid currentColor}.seg button{min-height:2.5rem;min-width:2.5rem;padding:0 .8rem;background:none;border:0;color:inherit;font:600 .875rem var(--cg-font-cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--cg-ground);color:var(--cg-ink)}
.proto .seg button:focus-visible{outline-color:var(--cg-ground)}
/* marco */
.hd{border-bottom:1px solid var(--cg-line);background:var(--cg-ground);position:sticky;top:0;z-index:30}
.hd .wrap{display:flex;align-items:center;gap:var(--s4) var(--s6);min-height:64px}
.brand{font:700 1.7rem var(--cg-font-cond);letter-spacing:.04em;text-transform:uppercase;color:var(--cg-ink);text-decoration:none;display:inline-flex;align-items:center;min-height:var(--cg-touch)}
.brand i{font-style:normal;color:var(--cg-mark)}.brand small{font:600 .8125rem var(--cg-font-cond);letter-spacing:.12em;color:var(--cg-muted);border-left:1px solid var(--cg-line);margin-left:.6rem;padding-left:.6rem}
.nav{display:flex;gap:var(--s1) var(--s6);margin-left:var(--s4)}
.nav a{display:inline-flex;align-items:center;min-height:var(--cg-touch);color:var(--cg-ink);text-decoration:none;font:600 1rem var(--cg-font-cond);letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;padding-top:3px}
.nav a:hover{border-color:var(--cg-contour)}.nav a[aria-current=page]{border-color:var(--cg-mark)}
.hd .end{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.ghostbtn,.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--cg-touch);padding:0 var(--s4);border:1.5px solid var(--cg-ink);background:transparent;color:var(--cg-ink);font:700 .95rem var(--cg-font-cond);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn{background:var(--cg-ink);color:var(--cg-ground)}.btn:hover{background:var(--cg-mark);border-color:var(--cg-mark);color:#fff}.ghostbtn:hover{border-color:var(--cg-mark);color:var(--cg-mark)}
.btn--mark{background:var(--cg-mark);border-color:var(--cg-mark);color:#fff}[data-theme=dark] .btn--mark{color:#0e1613}
.who{display:flex;align-items:center;gap:var(--s2)}.avatar{width:2.4rem;height:2.4rem;display:grid;place-items:center;border:1.5px solid var(--cg-ink);background:var(--cg-mark-soft);font:700 1rem var(--cg-font-cond)}
.menubtn{display:none}
.privacy-chip{display:inline-flex;align-items:center;gap:.4rem;font:600 .8125rem var(--cg-font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--cg-good);border:1.5px solid var(--cg-good);padding:.2rem .6rem;background:var(--cg-good-soft)}
.privacy-chip svg{width:.95rem;height:.95rem}
/* cuerpo */
.body{padding:var(--s6) 0 var(--s16);min-height:60vh}
.body--side{display:grid;grid-template-columns:14.5rem minmax(0,1fr);gap:var(--s6) var(--s8);align-items:start}
.side{position:sticky;top:5rem;max-height:calc(100dvh - 6rem);overflow-y:auto;border-top:2px solid var(--cg-ink)}
.side h4{margin:var(--s4) 0 var(--s1)}.side a{display:flex;align-items:center;min-height:var(--cg-touch);padding:0 var(--s3);color:var(--cg-ink);text-decoration:none;border-bottom:1px solid var(--cg-line);font:600 1rem var(--cg-font-cond);letter-spacing:.04em;text-transform:uppercase}
.side a:hover{background:var(--cg-panel)}.side a[aria-current=page]{box-shadow:inset 4px 0 0 var(--cg-mark);background:var(--cg-panel);font-weight:700}
.page-head{margin-bottom:var(--s6)}.page-head p{font-size:1.1875rem}
.ft{border-top:1px solid var(--cg-line);color:var(--cg-muted);font-size:.9rem;padding:var(--s4) 0 var(--s8)}.ft .wrap{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s6);justify-content:space-between}
/* piezas */
.grid{display:grid;gap:var(--s4)}.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--cg-panel);border:1.5px solid var(--cg-ink);padding:var(--s6);position:relative}
.card--raise{background:var(--cg-raise);box-shadow:var(--shadow)}.card--soft{border-color:var(--cg-line)}
.card h2,.card h3{margin-bottom:var(--s2)}
.stack{display:grid;gap:var(--s4)}.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--cg-ink);padding:.15rem .6rem;font:600 .8125rem var(--cg-font-cond);letter-spacing:.1em;text-transform:uppercase;background:var(--cg-ground);min-height:1.6rem}
.chip--good{border-color:var(--cg-good);color:var(--cg-good);background:var(--cg-good-soft)}.chip--warn{border-color:var(--cg-contour);color:var(--cg-contour);background:var(--cg-warm-soft)}.chip--mark{border-color:var(--cg-mark);color:var(--cg-mark);background:var(--cg-mark-soft)}.chip--err{border-color:var(--cg-err);color:var(--cg-err);background:var(--cg-err-soft)}
.banner{border:1.5px solid var(--cg-line);border-left:6px solid var(--cg-mark);background:var(--cg-raise);padding:var(--s3) var(--s4)}.banner--calm{border-left-color:var(--cg-good)}.banner--warn{border-left-color:var(--cg-contour)}
.step{display:grid;grid-template-columns:2.6rem 1fr;gap:var(--s3);align-items:start}.step b{display:grid;place-items:center;width:2.6rem;height:2.6rem;border:1.5px solid var(--cg-ink);font:700 1.2rem var(--cg-font-cond);background:var(--cg-ground)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2)}

  /* ---------- marco y router ---------- */

    document.documentElement.lang = state.lang

  }
  function go() { var m = (location.hash || '').match(/^#\/(\w+)\/(\w+)/); if (m && DEFAULT[m[1]]) { state.role = m[1]; state.route = m[2] } else { state.role = 'publico'; state.route = 'home' } render() }
  function navigate(role, route) {
    state.role = role; state.route = route; render(); window.scrollTo(0, 0)

    var m = $('#main'); m && m.focus({ preventScroll: true })
  }
  document.addEventListener('click', function (e) {
    var an = e.target.closest('a[href^="#/"]')

    var t = e.target.closest('[data-scroll],[data-role],[data-lang],[data-theme],[data-mood],[data-suggest],[data-cap],#openmenu,#closemenu,#scrim'); if (!t) return
    if (t.dataset.scroll) { e.preventDefault(); var s = document.getElementById(t.dataset.scroll); if (s) { s.scrollIntoView({ behavior: 'smooth', block: 'start' }); s.setAttribute('tabindex', '-1'); s.focus({ preventScroll: true }) } var dr = $('#drawer'); dr && dr.classList.remove('open') }
