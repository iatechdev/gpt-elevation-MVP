name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ES-44 offline: built-ins only, no DB, credentials or provider calls.
      - run: node evaluation/es44/cli.cjs --mode=validate
      - run: node --test test/es-44-evaluation.test.cjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # Lint: hay 4 errores previos (UserDashboard.tsx, BoardManifest.tsx) fuera del alcance de ES-9.
      # No bloquea hasta que un ticket los corrija; quitar continue-on-error entonces.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - name: Auditar dependencias (bloquea en alta o crítica)
        run: npm audit --omit=dev --audit-level=high
      # `npm run build` ejecuta tsc -b (tipos) y vite build
      - run: npm run build
        env:
          VITE_BACKEND_URL: ''

  backend:
    runs-on: ubuntu-latest
    # Postgres 17 desechable: misma versión mayor que la base de staging. Datos solo de CI.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: elevation
          POSTGRES_PASSWORD: elevation_ci
          POSTGRES_DB: elevation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elevation -d elevation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Sin lint en el backend: se comprueba la sintaxis y se corren los tests (P1 del PR #2).
      - name: Revisar sintaxis
        run: find . -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      # Conexión real a Postgres: base para las pruebas de integración con DB real (ES-80).
      - name: ES-14 — contexto, migración y concurrencia contra Postgres real
        env:
          ES14_TEST_DATABASE_URL: postgres://elevation:elevation_ci@127.0.0.1:5432/elevation_ci
        run: node --test test/integration/es-14-postgres.cjs
      - name: Verificar conexión y esquema contra Postgres real
        env:
          DATABASE_URL: postgres://elevation:elevation_ci@127.0.0.1:5432/elevation_ci
          DB_SSL: 'false'
        run: |
          node -e "
          const { sequelize } = require('./database');
          require('./associations')();
          sequelize.authenticate()
            .then(() => sequelize.sync())
            .then(() => sequelize.query(\"select count(*)::int as n from information_schema.tables where table_schema='public'\"))
            .then(([r]) => { console.log('tablas creadas:', r[0].n); process.exit(r[0].n > 0 ? 0 : 1); })
            .catch(e => { console.error(e.message); process.exit(1); });
          "
      # Migraciones (ES-59): sin deriva frente a sync() y ciclo deshacer/reaplicar, sobre bases desechables.
      - name: Migraciones sin deriva y con down/up
        env:
          DATABASE_URL: postgres://elevation:elevation_ci@127.0.0.1:5432/elevation_ci
          DB_SSL: 'false'
        run: npm run db:drift
      # Bloquea con vulnerabilidades altas o críticas en dependencias de producción (decisión de Mauricio, QA-57-06).
      # Las moderadas no bloquean: se listan en docs/DESPLIEGUE-RAILWAY.md como riesgo aceptado.
      - name: Auditar dependencias (bloquea en alta o crítica)
        run: npm audit --omit=dev --audit-level=high

  data-rights-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:data-rights:pg
        env:
          # Disposable runner-local service only. The test creates its own random database.
          ES23_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: ES-32 rutas, propiedad y ciclo de vida con PostgreSQL real
        run: npm run test:routes:pg
        env:
          ES32_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: ES-33 propietario y ciclo de vida (puertos ES-14/32 simulados)
        run: npm run test:career-plan:pg
        env:
          ES33_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: "ES-96 privacidad del terapeuta: solo lo autorizado (HTTP y PostgreSQL reales)"
        run: npm run test:therapist-privacy:pg
        env:
          ES96_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: ES-99 subida de documentos del profesional (HTTP y PostgreSQL reales)
        run: npm run test:validation-upload:pg
        env:
          ES99_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: "ES-98 terapeuta: ids, sesiones, matching y promedio (HTTP y PostgreSQL reales)"
        run: npm run test:therapist-validation:pg
        env:
          ES98_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: ES-85 worker de IA — rol, funciones, fencing y revocación concurrente (PostgreSQL)
        run: npm run test:worker:pg
        env:
          ES85_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: ES-33 integrado con ES-14 y ES-32 reales (PostgreSQL)
        run: npm run test:career-plan:integration:pg
        env:
          ES33I_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: ES-101 acceso del terapeuta con eliminación aceptada o cuenta inactiva (PostgreSQL)
        run: npm run test:therapist-deletion:pg
        env:
          ES101_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: "ES-95 solicitudes de profesionales: carrera de envíos simultáneos (PostgreSQL)"
        run: npm run test:pro-applications:pg
        env:
          ES95_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: "ES-107 hoja de vida en binario, migración y tope global (PostgreSQL)"
        run: npm run test:pro-cv-binary:pg
        env:
          ES107_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
