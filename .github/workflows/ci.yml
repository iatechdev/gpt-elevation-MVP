name: CI

on:
  pull_request:
  push:
    branches: [main]

# ES-358: mínimo privilegio para todos los jobs. Ninguno escribe en el repositorio (solo checkout, build, pruebas y caché); el ajuste por defecto
# del repositorio da escritura al token, así que se declara aquí. Un job que algún día necesite más lo declara en su propio bloque `permissions:`.
permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ES-44 offline: built-ins only, no DB, credentials or provider calls.
      - run: node evaluation/es44/cli.cjs --mode=validate
      - run: node --test test/es-44-evaluation.test.cjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # Lint: hay 4 errores previos (UserDashboard.tsx, BoardManifest.tsx) fuera del alcance de ES-9.
      # No bloquea hasta que un ticket los corrija; quitar continue-on-error entonces.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      # Bloquea alta o crítica, salvo la lista explícita y con fecha de caducidad de scripts/audit-gate.cjs (docs/AUDITORIA-DEPENDENCIAS.md).
      - name: Auditar dependencias (bloquea en alta o crítica)
        run: node scripts/audit-gate.cjs
      # `npm run build` ejecuta tsc -b (tipos) y vite build
      - run: npm run build
        env:
          VITE_BACKEND_URL: ''
      # ES-129: presupuesto de tamaño (JS inicial en gzip y mayor bloque); falla el PR si se excede.
      - name: Presupuesto de tamaño del frontend
        run: npm run build:check

  backend:
    runs-on: ubuntu-latest
    # Postgres 17 desechable: misma versión mayor que la base de staging. Datos solo de CI.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: elevation
          POSTGRES_PASSWORD: elevation_ci
          POSTGRES_DB: elevation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elevation -d elevation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # ES-385 (etapa 1): ESLint con SOLO reglas de defecto como bloqueantes (backend/eslint.config.cjs); no-unused-vars va en «warn» y no bloquea (etapa 2: limpiar por lotes).
      - name: ESLint (reglas de defecto)
        run: npm run lint
      # Además de lo anterior se comprueba la sintaxis y se corren los tests (P1 del PR #2).
      - name: Revisar sintaxis
        run: find . -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      # Conexión real a Postgres: base para las pruebas de integración con DB real (ES-80).
      - name: ES-14 — contexto, migración y concurrencia contra Postgres real
        env:
          ES14_TEST_DATABASE_URL: postgres://elevation:elevation_ci@127.0.0.1:5432/elevation_ci
        run: node --test test/integration/es-14-postgres.cjs
      - name: Verificar conexión y esquema contra Postgres real
        env:
          DATABASE_URL: postgres://elevation:elevation_ci@127.0.0.1:5432/elevation_ci
          DB_SSL: 'false'
        run: |
          node -e "
          const { sequelize } = require('./database');
          require('./associations')();
          sequelize.authenticate()
            .then(() => sequelize.sync())
            .then(() => sequelize.query(\"select count(*)::int as n from information_schema.tables where table_schema='public'\"))
            .then(([r]) => { console.log('tablas creadas:', r[0].n); process.exit(r[0].n > 0 ? 0 : 1); })
            .catch(e => { console.error(e.message); process.exit(1); });
          "
      # Migraciones (ES-59): sin deriva frente a sync() y ciclo deshacer/reaplicar, sobre bases desechables.
      - name: Migraciones sin deriva y con down/up
        env:
          DATABASE_URL: postgres://elevation:elevation_ci@127.0.0.1:5432/elevation_ci
          DB_SSL: 'false'
        run: npm run db:drift
      # Bloquea con vulnerabilidades altas o críticas en dependencias de producción (decisión de Mauricio, QA-57-06).
      # Las moderadas no bloquean: se listan en docs/DESPLIEGUE-RAILWAY.md como riesgo aceptado.
      - name: Auditar dependencias (bloquea en alta o crítica)
        run: npm audit --omit=dev --audit-level=high

  # ES-383: rendimiento APARTE de la corrección. Los techos de tiempo ya no están en las pruebas que bloquean (npm test y los scripts :pg solo los informan);
  # aquí se ejecutan en modo estricto, con el techo escalado por la velocidad que mide la misma corrida. NO bloquea PR: un runner cargado no pone el PR en rojo
  # (continue-on-error); el resultado se lee en el registro del job. Para que bloquee, quitar continue-on-error.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Rendimiento (PERF_STRICT=1; informa, no bloquea)
        env:
          ES85_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          ES179_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          ES180_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          ES216_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          ES29_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          npm run test:perf 2>&1 | tee "$RUNNER_TEMP/perf.log"
      # ES-383 (O452-2): un perf en rojo con continue-on-error ya no obliga a abrir el registro: anotacion ::warning:: por cada prueba lenta y tabla en el resumen del job.
      - name: Resumen de rendimiento (anotaciones y resumen del job)
        if: always()
        run: |
          LOG="$RUNNER_TEMP/perf.log"
          [ -f "$LOG" ] || { echo '### Rendimiento (test:perf)' >> "$GITHUB_STEP_SUMMARY"; echo 'No hubo registro (el paso previo no llego a ejecutarse).' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          SLOW=$(grep -E 'PERF LENTO' "$LOG" | sed -E 's/^[# ]*//' | sort -u || true)
          OKS=$(grep -cE 'PERF OK' "$LOG" || true)
          { echo '### Rendimiento (test:perf) - informativo, no bloquea'; echo;
            echo "Mediciones dentro del techo: ${OKS:-0}";
            if [ -n "$SLOW" ]; then echo; echo '**Pruebas LENTAS (revisar; no bloquean el PR):**'; echo; echo '```'; echo "$SLOW"; echo '```'; else echo; echo 'Ninguna prueba lenta.'; fi; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SLOW" ]; then echo "$SLOW" | while IFS= read -r line; do echo "::warning title=Rendimiento lento (test:perf)::$line"; done; fi
          if grep -qE '^# fail [1-9]|^not ok' "$LOG"; then echo '::warning title=test:perf fallo::Hay pruebas de rendimiento en rojo (ver el registro del paso anterior); no bloquea el PR.'; fi

  data-rights-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
