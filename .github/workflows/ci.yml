  # ES-351 (E343-3): guardia de accesibilidad de ES-290/ES-291 (axe label-content-name-mismatch y scrollable-region-focusable)
  # sobre 216 páginas con API simulada y datos sintéticos. Sin base de datos, sin secretos ni datos reales.
  # Playwright y axe-core se instalan en un directorio temporal con versiones fijas (no tocan package-lock.json).
  a11y-guard:
    runs-on: ubuntu-latest
    # Mínimo privilegio: el job solo lee el repositorio (la caché usa su propio token de ejecución).
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_BACKEND_URL: ''
      - name: Instalar Playwright y axe-core (versiones fijas, fuera del proyecto)
        run: |
          mkdir -p "$RUNNER_TEMP/guard" && cd "$RUNNER_TEMP/guard"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.64.1 axe-core@4.10.2
      # Caché de Chromium con clave por versión de Playwright; las dependencias del sistema se instalan siempre.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1-${{ runner.os }}
      - name: Instalar Chromium y dependencias del sistema
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          cd "$RUNNER_TEMP/guard"
          if [ "$CACHE_HIT" = 'true' ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Auditoría ES-290/ES-291 (STRICT=1 DATA=1; falla con cualquier hallazgo)
        env:
          STRICT: '1'
          DATA: '1'
        run: |
          G="$RUNNER_TEMP/guard/node_modules"
          npx vite preview --port 4350 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4350/ >/dev/null && break; sleep 1; done
          ES290_URL=http://127.0.0.1:4350 PLAYWRIGHT_MODULE="$G/playwright" AXE_PATH="$G/axe-core/axe.min.js" node scripts/es290-291-audit.cjs
      # ES-332 (punto 5): «Mi panel» con la API caída: 500 y corte de red por cada lectura, aviso en su tarjeta, «Reintentar» solo de lo fallido y foco. API simulada, datos sintéticos.
      - name: Mi panel con la API caída (ES-332; 390 px, ES/EN)
        env:
          ES332_QUICK: '1'
        run: |
          G="$RUNNER_TEMP/guard/node_modules"
          npx vite preview --port 4351 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4351/ >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4351 PLAYWRIGHT_MODULE="$G/playwright" AXE_PATH="$G/axe-core/axe.min.js" node scripts/es332-dashboard-errores.cjs
