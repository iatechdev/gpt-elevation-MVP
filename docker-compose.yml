# Postgres local para quien ya tenga Docker (ES-80). Alternativa sin Docker: `npm run db:local` en backend/.
# Misma versión mayor que la base de staging (PostgreSQL 17). Usuario y clave locales NO son secretos.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: elevation
      POSTGRES_PASSWORD: elevation_local
      POSTGRES_DB: elevation_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - elevation_pgdata:/var/lib/postgresql/data
volumes:
  elevation_pgdata:
